          # v41: muito mais buscas (146, em 12 abas, incluindo Negócios, Saúde, Educação, Cultura e Audiolivros infantis),
          # até 200 resultados por busca e mais programas por aba. A busca roda aos poucos (PODCASTS_BUSCAS_POR_VEZ por execução,
          # a cada 15 min) e os achados se acumulam: cada semana entram os novos, até o limite de cada aba.
          AVD_HOSTS = [h.strip().lower() for h in (os.environ.get("PODCASTS_SERVIDORES_AVD") or "d3ctxlq1ktw2nl.cloudfront.net").split(",") if h.strip()]
          AUTO_MAX = int(num("AUDIOLIVROS_AUTO_POR_ABA", 40, 0, 120))     # audiolivros por aba (Em português, Infantis, Outros idiomas)
          AUTO_POD_MAX = int(num("PODCASTS_AUTO_POR_ABA", 20, 0, 60))     # podcasts por aba (9 abas)
          AUTO_EPISODES = int(num("PODCASTS_AUTO_EPISODIOS", 12, 3, 60))  # episódios guardados de cada podcast descoberto (podcasts.json mais leve)
          TERMS_PER_RUN = int(num("PODCASTS_BUSCAS_POR_VEZ", 30, 1, 400)) # buscas no catálogo por execução
          DISCOVER_S = num("PODCASTS_MINUTOS_BUSCA", 2, 0.1, 10) * 60     # tempo máximo da busca por execução
          AUTO_DAYS = 7          # recomeça as buscas a cada 7 dias (ou na hora, se a lista de buscas mudar)
          AUTO_REFRESH_H = 24    # episódios dos podcasts descobertos: 1 vez por dia (os da lista fixa: a cada 6 h)
          AUTO_BOOK_REFRESH_H = 24 * 7   # audiolivros descobertos quase não mudam: 1 vez por semana
          MAX_AGE_DAYS = {"noticias": 45, "esportes": 180}   # podcast parado há mais tempo que isso fica de fora (demais abas: 2 anos)
          BOOK_TABS = ("livros-pt", "livros-infantis", "livros-outros")
          POD_TABS = ("noticias", "humor", "ciencia", "historias", "esportes", "negocios", "saude", "educacao", "cultura")
          SEARCHES = {
              # Audiolivros: (busca, loja, idioma)
              "livros-pt": [(t, "BR", "pt") for t in (
                  "audiolivro", "audiolivro completo", "audiolivros", "audiobook em português", "audiobook completo", "livro narrado", "livros narrados",
                  "contos narrados", "literatura brasileira em áudio", "machado de assis audiolivro", "domínio público áudio", "clássicos da literatura audiolivro",
                  "livro em áudio", "crônicas narradas", "poemas narrados", "conto narrado", "eça de queirós audiolivro", "josé de alencar audiolivro",
                  "lima barreto audiolivro", "aluísio azevedo audiolivro", "leitura em voz alta", "audiolivro romance", "audiolivro terror", "audiolivro grátis")],
              "livros-infantis": [(t, "BR", "pt") for t in (
                  "histórias infantis", "histórias para dormir", "historinhas", "contos de fadas", "histórias para crianças", "audiolivro infantil",
                  "era uma vez", "fábulas", "contação de histórias", "historinhas para dormir", "livro infantil narrado")],
              "livros-outros": [(t, "US", "en") for t in (
                  "full audiobook", "librivox audiobook", "public domain audiobook", "classic audiobook", "short stories audiobook", "audiobooks",
                  "classic literature audiobook", "sherlock holmes audiobook", "read aloud books", "poetry audiobook", "jane austen audiobook",
                  "edgar allan poe audiobook", "bedtime stories audiobook")] + [(t, "US", "es") for t in (
                  "audiolibro completo", "audiolibros", "cuentos narrados", "audiolibros clásicos", "audiolibro en español", "libros narrados",
                  "relatos narrados", "audiolibro gratis")],
              # Podcasts em português (v34 + v41)
              "noticias": [(t, "BR", "pt") for t in ("notícias", "política", "jornalismo", "economia", "notícias do dia", "resumo de notícias", "análise política", "geopolítica", "atualidades", "mercado financeiro hoje")],
              "humor": [(t, "BR", "pt") for t in ("humor", "entrevistas", "bate papo", "comédia", "stand up", "resenha", "papo de boteco", "talk show", "conversa", "podcast de humor")],
              "ciencia": [(t, "BR", "pt") for t in ("ciência", "tecnologia", "divulgação científica", "programação", "inteligência artificial", "astronomia", "física", "biologia", "inovação", "cibersegurança")],
              "historias": [(t, "BR", "pt") for t in ("true crime", "crimes reais", "histórias de terror", "história do brasil", "mistérios", "casos reais", "histórias reais", "lendas urbanas", "história mundial", "investigação criminal")],
              "esportes": [(t, "BR", "pt") for t in ("futebol", "esportes", "nba", "fórmula 1", "futebol brasileiro", "brasileirão", "corrida de rua", "vôlei", "mma", "tênis")],
              "negocios": [(t, "BR", "pt") for t in ("empreendedorismo", "negócios", "finanças pessoais", "investimentos", "marketing digital", "carreira", "liderança", "vendas", "educação financeira", "produtividade")],
              "saude": [(t, "BR", "pt") for t in ("saúde mental", "bem-estar", "psicologia", "meditação", "nutrição", "autoconhecimento", "ansiedade", "saúde", "atividade física", "sono")],
              "educacao": [(t, "BR", "pt") for t in ("aprender inglês", "inglês", "espanhol", "educação", "filosofia", "história", "concursos", "enem", "língua portuguesa", "sociologia")],
              "cultura": [(t, "BR", "pt") for t in ("cinema", "séries", "games", "música", "literatura", "cultura pop", "anime", "quadrinhos", "música brasileira", "arte")],
          }
          # Intercala as abas (1ª busca de cada aba, depois a 2ª...): desde a 1ª execução todas as abas ganham programas.
          DISCOVER = []
          for _i in range(max(len(v) for v in SEARCHES.values())):
              for _tab, _terms in SEARCHES.items():
                  if _i < len(_terms): DISCOVER.append((_terms[_i][0], _terms[_i][1], _tab, _terms[_i][2]))
          CFG = hashlib.sha1(json.dumps([DISCOVER, AVD_HOSTS, AUTO_MAX, AUTO_POD_MAX]).encode()).hexdigest()[:12]
          BOOKISH = re.compile(r"\b(audio ?livros?|audio ?books?|audio ?libros?|livros? (narrados?|em audio|falados?|para ouvir|lidos?)|contos? (narrados?|lidos?|em audio)|"
                               r"cuentos? (narrados?|leidos?)|relatos? narrados?|cronicas? narradas?|poemas? (narrados?|declamados?)|poesias? (narradas?|declamadas?|falada)|"
                               r"literatura (em audio|narrada|falada)|dominio publico|leituras? (de ouvido|em voz alta|narradas?)|librivox|read aloud|"
                               r"public domain (books?|stories|audio)|libros? (narrados?|leidos?|en audio))\b")
          KIDS = re.compile(r"\b(historias? (infanti[ls]|para (dormir|criancas?|ninar))|historinhas?|contos? (de fadas|infanti[ls])|era uma vez|fabulas?|"
                            r"audio ?livros? infanti[ls]|contacao de historias|livros? infanti[ls]|bedtime stories|cuentos? infantiles)\b")
          ANCHOR_FEED = re.compile(r"^https?://(www\.)?anchor\.fm/s/[0-9a-f]+/podcast/rss", re.I)
          RELIG = re.compile(r"\b(biblia|bible|biblical|jesus|cristo|christ|christian|crista|cristao|igreja|church|evangel\w*|gospel|sermao|sermon|pregacao|preaching|"
                             r"louvor|worship|oracao|prayer|devocional|devotional|catolic\w*|catholic|espirita|espiritismo|umbanda|candomble|islam\w*|quran|torah|"
                             r"rosario|terco|pastor|padre|apostolo|salmos?|psalms?)\b")
          RELIG_GENRE = re.compile(r"relig|spiritual|espiritual|christian|cristianismo|judaism|juda[ií]smo|islam|hindu|buddh|budismo", re.I)
          CLIPS = re.compile(r"\b(cortes?|clips?|melhores momentos)\b")
          EN_WORDS = re.compile(r"\b(the|and|of|with|your|my|our|show|daily|weekly|talk|life|world|stories|story|true|podcast network|collection|classics?|"
                                r"books?|read|reading|tales|short|sleep|bedtime|kids|children|for|from|to|in|is)\b")
          PT_WORDS = re.compile(r"\b(de|do|da|dos|das|com|e|o|em|na|no|nas|nos|para|pra|por|um|uma|que|os|as|sobre|papo|brasil|historias?|noticias|futebol|ciencia|tecnologia|"
                                r"humor|crimes?|resenha|conversa|politica|economia|esportes?|misterios?|terror|casos?|livros?|contos?|audiolivros?|historinhas?|criancas|"
                                r"infanti[ls]|dormir|classicos|literatura|leituras?|brasileira|portugues|narrados?|narradas?)\b")

          def looks_pt(name, artist):
              raw = f"{name} {artist}"
              if re.search(r"[ãõçáéíóúâêôà]", raw.lower()): return True
              f = fold(raw)
              return len(PT_WORDS.findall(f)) >= len(EN_WORDS.findall(f))

          def parse_date(s):
              try: return time.mktime(time.strptime(str(s)[:19], "%Y-%m-%dT%H:%M:%S")) - time.timezone
              except Exception: return 0.0

          def avd_host(e):
              u = e.get("direct") or unwrap(e.get("url") or "") or e.get("url") or ""
              return (urllib.parse.urlsplit(u).hostname or "").lower()

          # Serviços de estatística que ficam na frente do áudio (mesma lista do site, src/lib/podcasts.ts).
          PREFIXES = [re.compile(p, re.I) for p in (
              r"^https?://(?:www\.)?dts\.podtrac\.com/redirect\.[a-z0-9]+/", r"^https?://(?:www\.)?podtrac\.com/pts/redirect\.[a-z0-9]+/",
              r"^https?://(?:chrt\.fm|chtbl\.com)/track/[^/]+/", r"^https?://pdst\.fm/e/", r"^https?://op3\.dev/e/(?:[^/]*,[^/]*/)?",
              r"^https?://(?:pscrb\.fm|verifi\.podscribe\.com)/rss/p/", r"^https?://mgln\.ai/e/[^/]+/", r"^https?://arttrk\.com/p/[^/]+/",
              r"^https?://clrtpod\.com/m/", r"^https?://prfx\.byspotify\.com/e/", r"^https?://pfx\.vpixl\.com/[^/]+/",
              r"^https?://(?:www\.)?podtrac\.com/[^/]+/redirect\.[a-z0-9]+/", r"^https?://tracking\.swap\.fm/track/[^/]+/", r"^https?://growx\.podkite\.com/[^/]+/[^/]+/")]

          def unwrap(url):
              """Tira os serviços de estatística da frente e abre o anchor.fm/.../https%3A%2F%2F... -> endereço do arquivo.
              None se não houver nada para tirar."""
              u = url or ""
              for _ in range(6):
                  m = re.match(r"^https?://(?:www\.)?anchor\.fm/.*?/(https?%3A%2F%2F.+)$", u, re.I)
                  if m:
                      u = urllib.parse.unquote(m.group(1)); continue
                  rx = next((r for r in PREFIXES if r.match(u)), None)
                  if not rx: break
                  rest = rx.sub("", u, count=1)
                  u = rest if re.match(r"^https?://", rest, re.I) else "https://" + rest
              u = re.sub(r"^http://", "https://", u)
              return u if u != re.sub(r"^http://", "https://", url or "") else None

          def why_not(r, tab, lang, curated):
              """Motivo para deixar o programa de fora (None = entra). Só entram programas hospedados no anchor (toca na AVD)."""
              if not ANCHOR_FEED.match(str(r.get("feedUrl") or "")): return "fora do servidor da AVD"
              name, artist = str(r.get("collectionName") or ""), str(r.get("artistName") or "")
              genres = " ".join([str(r.get("primaryGenreName") or "")] + [str(g) for g in (r.get("genres") or [])])
              n = fold(name)
              if len(n) < 3: return "nome curto"
              if RELIG.search(fold(f"{name} {artist}")) or RELIG_GENRE.search(genres): return "religioso"
              tracks = r.get("trackCount") or 0
              if tab in BOOK_TABS:
                  if not (KIDS if tab == "livros-infantis" else BOOKISH).search(n) or tracks < 2: return "não parece audiolivro"
                  if tab != "livros-outros" and not looks_pt(name, artist): return "não parece português"
                  return None
              if BOOKISH.search(n) or KIDS.search(n) or CLIPS.search(n) or tracks < 5: return "audiolivro, cortes ou poucos episódios"
              if NOW - parse_date(r.get("releaseDate")) > MAX_AGE_DAYS.get(tab, 730) * 86400: return "parado"
              if lang == "pt" and not looks_pt(name, artist): return "não parece português"
              if any(matches(d, name, artist) for d in curated): return "já está na lista (ou é um canal de cortes dele)"
              return None

          def discover(auto, known, curated):
              """v41: continua as buscas de onde parou (no máximo TERMS_PER_RUN buscas ou DISCOVER_S segundos por execução) e
              acumula os programas novos hospedados no anchor (toca na AVD), até o limite de cada aba. Devolve quantos entraram."""
              items = auto.setdefault("items", [])
              per_tab = {}
              for a in items: per_tab[a["tab"]] = per_tab.get(a["tab"], 0) + 1
              cap = lambda tab: AUTO_MAX if tab in BOOK_TABS else AUTO_POD_MAX
              cursor, added, t0, done = int(auto.get("cursor") or 0), 0, time.time(), 0
              while cursor < len(DISCOVER) and done < TERMS_PER_RUN and time.time() - t0 < DISCOVER_S:
                  term, country, tab, lang = DISCOVER[cursor]
                  if per_tab.get(tab, 0) < cap(tab):
                      q = urllib.parse.urlencode({"media": "podcast", "entity": "podcast", "limit": 200, "country": country, "term": term})
                      res = itunes(f"https://itunes.apple.com/search?{q}").get("results", []); time.sleep(GAP_S)   # RateLimited: para aqui e continua na próxima
                      done += 1
                      for r in res:
                          cid = r.get("collectionId")
                          if not isinstance(cid, int) or cid in known or per_tab.get(tab, 0) >= cap(tab): continue
                          if why_not(r, tab, lang, curated): continue
                          name, artist = str(r.get("collectionName") or ""), str(r.get("artistName") or "")
                          known.add(cid); per_tab[tab] = per_tab.get(tab, 0) + 1; added += 1
                          items.append({"id": f"auto-{cid}", "name": clean(name, 120), "cid": cid, "tab": tab, "lang": lang, "book": tab in BOOK_TABS, "country": country, "auto": True,
                                        "info": {"collectionId": cid, "name": clean(name, 120), "artist": clean(artist, 120),
                                                 "art": r.get("artworkUrl600") or r.get("artworkUrl100") or "", "link": r.get("collectionViewUrl", ""), "resolvedAt": NOW}})
                  cursor += 1
                  auto["cursor"] = cursor
              if cursor >= len(DISCOVER):   # rodada completa: recomeça daqui a AUTO_DAYS dias
                  auto.update({"cursor": 0, "at": NOW})
              return added

          SIGNED = re.compile(r"(expires|signature|x-amz-|token|policy|key-pair|hdnts|exp=)", re.I)
          def final_url(url):
              """Segue os redirecionamentos de estatística (podtrac, chartable, pdst...) até o servidor do áudio."""
              for method in ("HEAD", "GET"):
                  try:
                      req = urllib.request.Request(url, method=method, headers={"User-Agent": UA, "Range": "bytes=0-1"})
                      with urllib.request.urlopen(req, timeout=12) as r:
                          end = r.geturl()
                      if end and end != url and end.startswith("https://") and not SIGNED.search(urllib.parse.urlparse(end).query):
                          return end
                      return None
                  except Exception:
                      continue
              return None

          def main():
              defs = read_defs()
              if defs is None:
                  print("::warning title=Podcasts::index.html sem o bloco podcasts-lista (index.html antigo?)"); return 0
              st = load_state()
              prev = st.get("data") or {}
              if not prev:
                  site = os.environ.get("SITE_URL", "").rstrip("/")
                  if site:
                      try:
                          prev = get_json(f"{site}/podcasts.json"); print("lista anterior recuperada do site")
                      except Exception as e:
                          print(f"sem lista anterior no site ({e})")
              prev_next = float(st.get("nextAt") or 0)
              due = time_due = NOW >= prev_next
              start = time.time()
              auto = st.get("auto") or {}
              # v41: os achados da v34 continuam (se a aba ainda existir); a busca continua de onde parou.
              auto["items"] = [a for a in auto.get("items", []) if isinstance(a, dict) and a.get("id") and a.get("tab") in BOOK_TABS + POD_TABS and isinstance(a.get("cid"), int)]
              auto_changed, disc_note = False, ""
              if auto.get("cfg") != CFG:
                  auto.update({"cfg": CFG, "cursor": 0, "at": 0}); auto_changed = True
              if (AUTO_MAX or AUTO_POD_MAX) and (int(auto.get("cursor") or 0) > 0 or NOW - float(auto.get("at") or 0) > AUTO_DAYS * 86400):
                  curated_ids = {d["id"] for d in defs}
                  known = ({d["cid"] for d in defs if isinstance(d.get("cid"), int)} | {i.get("collectionId") for k, i in (st.get("resolved") or {}).items() if k in curated_ids}
                           | {a["cid"] for a in auto["items"]} | set(auto.get("rejected") or []))
                  first = int(auto.get("cursor") or 0)
                  try:
                      added = discover(auto, known, [d for d in defs if d.get("match")])
                  except RateLimited:
                      added = None
                  except Exception as e:
                      added = None; print(f"descoberta de podcasts e audiolivros falhou ({str(e)[:120]}); continua na próxima execução")
                  auto_changed = True
                  last = int(auto.get("cursor") or 0) or len(DISCOVER)
                  books = sum(1 for a in auto["items"] if a.get("book"))
                  disc_note = (f"Busca de programas compatíveis com a AVD: buscas {first + 1}–{last} de {len(DISCOVER)}"
                               f"{' (o Apple Podcasts pediu uma pausa; continua na próxima execução)' if added is None else ''}; {added or 0} novos nesta execução; "
                               f"total descobertos: {len(auto['items']) - books} podcasts e {books} audiolivros.")
                  print(disc_note)
              auto_items = auto["items"]
              defs = defs + [a for a in auto_items if all(d["id"] != a["id"] for d in defs)]
              # v32: podcast ou audiolivro novo na lista do site (index.html novo) = atualiza já, sem esperar as 6 h.
              seen = set(st.get("seen") or [s.get("id") for s in prev.get("shows", []) if isinstance(s, dict)])
              novos = [d["id"] for d in defs if d["id"] not in seen]
              if novos and not due:
                  print(f"podcasts: {len(novos)} itens novos na lista do site; atualizando agora"); due = True
              if not due and prev.get("shows"):
                  OUT.write_text(json.dumps(prev, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
                  print(f"podcasts: próxima atualização em {iso(float(st['nextAt']))}; republicada a lista de {prev.get('updatedAt')}")
                  if auto_changed:   # a busca andou: guarda onde parou
                      STATE.write_text(json.dumps({**st, "auto": auto}, ensure_ascii=False), encoding="utf-8")
                      if disc_note: summary(f"\n### Podcasts e audiolivros\n\n{disc_note}\n")
                  out("salvar", "true" if auto_changed else "false"); return 0

              resolved = st.get("resolved") or {}
              for a in auto_items:
                  if a["id"] not in resolved and a.get("info"): resolved[a["id"]] = a["info"]
              prev_shows = {s.get("id"): s for s in prev.get("shows", []) if isinstance(s, dict)}
              shows, rows, pending, limited = [], [], False, False
              rejected = set(auto.get("rejected") or [])
              for d in defs:
                  old = prev_shows.get(d["id"])
                  if d.get("auto") and old and NOW - float(old.get("at") or 0) < (AUTO_BOOK_REFRESH_H if d.get("book") else AUTO_REFRESH_H) * 3600:
                      shows.append(old); rows.append(f"| {d['name']} | mantido (descoberto; episódios atualizados 1 vez por {'semana' if d.get('book') else 'dia'}) |"); continue
                  # v41: os da lista fixa só voltam ao catálogo a cada PODCASTS_A_CADA_HORAS (a busca de novos não força tudo de novo).
                  if not d.get("auto") and old and NOW - float(old.get("at") or 0) < EVERY_H * 3600 - 600:
                      shows.append(old); rows.append(f"| {d['name']} | mantido (atualizado há menos de {EVERY_H:g} h) |"); continue
                  if limited or time.time() - start > BUDGET_S:
                      pending = True
                      if old: shows.append(old)
                      rows.append(f"| {d['name']} | mantido da lista anterior |" if old else f"| {d['name']} | fica para a próxima execução |"); continue
                  try:
                      info = resolved.get(d["id"])
                      if not info or NOW - float(info.get("resolvedAt", 0)) > RESOLVE_DAYS * 86400:
                          info = resolve(d); time.sleep(GAP_S)
                          if not info:
                              resolved.pop(d["id"], None)
                              if old: shows.append(old)
                              rows.append(f"| {d['name']} | não encontrado no Apple Podcasts{' (mantido o anterior)' if old else ''} |"); continue
                          resolved[d["id"]] = info
                      eps = episodes(info, d.get("country") or "BR", bool(d.get("book")), AUTO_EPISODES if d.get("auto") else None); time.sleep(GAP_S)
                      if not eps:
                          if old: shows.append(old)
                          rows.append(f"| {d['name']} | sem episódios no catálogo |"); continue
                      known = {e["id"]: e.get("direct") for e in (old or {}).get("episodes", []) if isinstance(e, dict)}
                      for e in eps:
                          if known.get(e["id"]): e["direct"] = known[e["id"]]
                      for e in eps:   # anchor: o endereço do arquivo vem dentro do link (servidor que toca na AVD)
                          uw = unwrap(e["url"])
                          if not e.get("direct") and uw and (urllib.parse.urlsplit(uw).hostname or "").lower() in AVD_HOSTS: e["direct"] = uw
                      if d.get("auto") and avd_host(eps[0]) not in AVD_HOSTS:   # v41: sai da lista de descobertos e não volta
                          rejected.add(d["cid"]); rows.append(f"| {d['name']} | retirado (o áudio não fica num servidor que toca na AVD) |"); continue
                      if d.get("book") or d.get("auto"):   # audiolivro (até 200 capítulos) e descobertos: só o endereço do arquivo (podcasts.json mais leve)
                          for e in eps:
                              if e.get("direct"): e["url"] = e.pop("direct")
                      show = {"id": d["id"], "name": info["name"] or d["name"], "artist": info["artist"], "art": info["art"], "link": info["link"], "cid": info.get("collectionId"), "episodes": eps, "at": NOW}
                      if d.get("auto"): show.update({"tab": d["tab"], "lang": d["lang"], "book": bool(d.get("book")), "auto": True})
                      shows.append(show)
                      last = max(e["date"] for e in eps)[:10]
                      rows.append(f"| {d['name']} | {len(eps)} {'capítulos (audiolivro)' if d.get('book') else 'episódios'} — último em {last} |")
                  except RateLimited:
                      limited, pending = True, True
                      if old: shows.append(old)
                      rows.append(f"| {d['name']} | o Apple Podcasts pediu uma pausa; tenta de novo em 1 hora |")
                  except Exception as e:
                      if old: shows.append(old)
                      rows.append(f"| {d['name']} | falhou ({str(e)[:80]}){' — mantido o anterior' if old else ''} |")

              # Endereço final do áudio dos 3 primeiros da lista: os 3 mais novos (audiolivro: os 3 primeiros capítulos) (ajuda em redes que bloqueiam os serviços de estatística).
              todo = [e for s in shows for e in s["episodes"][:3] if "direct" not in e and avd_host(e) not in AVD_HOSTS]
              with ThreadPoolExecutor(8) as pool:
                  for e, end in zip(todo, pool.map(lambda e: final_url(e["url"]), todo)):
                      if end and end != e["url"]: e["direct"] = end
              if rejected:
                  auto["rejected"] = sorted(rejected)[-2000:]
                  auto["items"] = [a for a in auto["items"] if a["cid"] not in rejected]
                  shows = [s_ for s_ in shows if not (s_.get("auto") and s_.get("cid") in rejected)]
              data = {"updatedAt": iso(NOW), "shows": shows}
              OUT.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
              # v41: execução puxada só por programas novos não adia a atualização normal (a cada PODCASTS_A_CADA_HORAS).
              next_at = NOW + 3600 if limited else NOW + 900 if pending else (NOW + EVERY_H * 3600 if time_due or not prev_next else prev_next)
              seen_now = [d["id"] for d in defs if not pending or any(s["id"] == d["id"] for s in shows)]
              STATE.write_text(json.dumps({"data": data, "resolved": resolved, "nextAt": next_at, "seen": seen_now, "auto": auto}, ensure_ascii=False), encoding="utf-8")
              out("salvar", "true")
              total = sum(len(s["episodes"]) for s in shows)
              summary(f"\n### Podcasts e audiolivros\n\n{len(shows)} de {len(defs)} podcasts e audiolivros, {total} episódios. Próxima atualização: {iso(next_at)}.\n\n"
                      + (f"{disc_note}\n\n" if disc_note else "") + "| Podcast | Situação |\n|---|---|\n" + "\n".join(rows) + "\n")
              if not shows: print("::warning title=Podcasts::nenhum podcast foi encontrado nesta execução")
              return 0

          if __name__ == "__main__":
              sys.exit(main())
          SCRIPT
          python3 /tmp/podcasts.py

      - name: Guardar a lista de podcasts
        if: always() && steps.podcasts.outputs.salvar == 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/cyberwave-podcasts
          key: podcasts-${{ github.run_id }}-${{ github.run_attempt }}

      # Extras OPCIONAIS para músicas fora do índice (o site funciona sem eles):
      #   MUSICA_PROXY_URL (variável) – endereço do buscador próprio na Vercel, ex.: https://<projeto>.vercel.app/api/musica
      #   CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID (segredos) – publica o mesmo buscador na Cloudflare
      #   YOUTUBE_API_KEY (variável ou segredo) – chave da YouTube Data API v3, restrita ao site (fica visível no site)
      - name: Publicar o buscador de músicas (Cloudflare Worker, opcional)
        id: worker
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Sem CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID: pulando (use a Vercel ou a variável MUSICA_PROXY_URL)."
            exit 0
          fi
          if [ ! -f worker/musica-worker.js ]; then echo "::warning title=Músicas::worker/musica-worker.js não está no repositório"; exit 0; fi
          ORIGIN="https://${GITHUB_REPOSITORY_OWNER,,}.github.io"
          set +e
          npx --yes wrangler@3 deploy worker/musica-worker.js --name cyberwave-musica --compatibility-date 2024-11-01 --var "ORIGENS:${ORIGIN}" > wrangler.log 2>&1
          CODE=$?
          set -e
          sed -E 's/[A-Za-z0-9_-]{30,}/***/g' wrangler.log
          URL=$(grep -oE 'https://cyberwave-musica\.[a-z0-9-]+\.workers\.dev' wrangler.log | head -1)
          if [ -n "$URL" ]; then echo "url=$URL" >> "$GITHUB_OUTPUT"; echo "Buscador publicado em $URL"; fi
          if [ $CODE -ne 0 ] || [ -z "$URL" ]; then
            echo "falhou=1" >> "$GITHUB_OUTPUT"
            if grep -qi "workers.dev subdomain" wrangler.log; then
              echo "::warning title=Músicas::Crie seu subdomínio workers.dev: entre uma vez em Workers & Pages no painel da Cloudflare e rode de novo."
            else
              echo "::warning title=Músicas::A publicação na Cloudflare falhou; veja o log deste passo."
            fi
          fi
          rm -f wrangler.log

      - name: Configurar e testar as fontes de músicas
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY || vars.YOUTUBE_API_KEY }}
          MUSICA_PROXY_URL: ${{ vars.MUSICA_PROXY_URL || steps.worker.outputs.url }}
          CLOUDFLARE_FALHOU: ${{ steps.worker.outputs.falhou }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          from pathlib import Path
          p = Path("musica.json")
          cfg = {}
          if p.exists():
              try: cfg = json.loads(p.read_text(encoding="utf-8"))
              except Exception: print("::warning title=Músicas::musica.json inválido; será refeito")
          for k in ("jamendoClientId", "appleMusicDeveloperToken", "appleMusicStorefront"): cfg.pop(k, None)
          env = lambda k: os.environ.get(k, "").strip()
          if env("YOUTUBE_API_KEY"): cfg["youtubeApiKey"] = env("YOUTUBE_API_KEY")
          url = env("MUSICA_PROXY_URL").rstrip("/")
          if url:
              u = urllib.parse.urlparse(url)
              if u.hostname and u.hostname.endswith(".vercel.app") and u.path in ("", "/"):
                  url = f"{u.scheme}://{u.netloc}/api/musica"
              cfg["musicaProxyUrl"] = url
          p.write_text(json.dumps(cfg, ensure_ascii=False, indent=1), encoding="utf-8")

          def teste(params):
              base = cfg["musicaProxyUrl"]
              full = base + ("&" if "?" in base else "?") + urllib.parse.urlencode(params)
              t0 = time.time()
              req = urllib.request.Request(full, headers={"User-Agent": "CyberwaveRadio-Actions/1.0"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode("utf-8")), round((time.time() - t0) * 1000)

          linhas = []
          if cfg.get("musicaProxyUrl"):
              try:
                  saude, ms = teste({"op": "saude"})
                  linhas.append(f"| Buscador próprio | responde ({saude.get('versao', '?')}, {ms} ms) — {cfg['musicaProxyUrl']} |")
                  try:
                      hits, ms = teste({"op": "buscar", "q": "Linkin Park Numb"})
                      linhas.append(f"| Busca no YouTube pelo buscador | {len(hits)} vídeos ({ms} ms) |")
                  except Exception as e:
                      linhas.append(f"| Busca no YouTube pelo buscador | FALHOU: {str(e)[:120]} |")
                  try:
                      lf, ms = teste({"op": "lastfm", "artist": "Linkin Park", "title": "Numb"})
                      linhas.append(f"| Last.fm pelo buscador | {len(lf.get('ids', []))} vídeo(s) ({ms} ms) |")
                  except Exception as e:
                      linhas.append(f"| Last.fm pelo buscador | FALHOU: {str(e)[:120]} |")
              except Exception as e:
                  linhas.append(f"| Buscador próprio | NÃO RESPONDE ({str(e)[:120]}) — confira o endereço em MUSICA_PROXY_URL |")
          else:
              extra = " (a publicação na Cloudflare falhou — veja o passo anterior)" if env("CLOUDFLARE_FALHOU") else ""
              linhas.append(f"| Buscador próprio (opcional) | não configurado{extra} — o site usa o índice de músicas completas (tabela acima) |")
          linhas.append(f"| YouTube Data API | {'configurada' if cfg.get('youtubeApiKey') else 'sem chave (opcional)'} |")
          print("\n".join(linhas))
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
                  s.write("\n### Fontes de músicas\n\n| Fonte | Situação |\n|---|---|\n| Catálogo iTunes/Deezer | sem cadastro |\n| Internet Archive | sem cadastro |\n" + "\n".join(linhas) + "\n\nNo site, abra **Músicas sob demanda → Diagnóstico das fontes** para ver o que funciona no seu aparelho.\n")
          PY

      # Publicação à prova de "Re-run": cada tentativa envia o site com um nome próprio (github-pages-1,
      # github-pages-2, ...) e publica exatamente esse pacote. Antes, repetir uma execução que falhou deixava
      # dois pacotes "github-pages" na mesma execução e a publicação parava com
      # "Multiple artifacts named github-pages were unexpectedly found for this workflow run".
      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .

      # Logo depois do envio, o GitHub às vezes ainda não enxerga o pacote e a publicação falha com
      # "No artifacts named ... were found" (acontece quando envio e publicação ficam na mesma etapa).
      - name: Aguardar o pacote ficar disponível
        run: sleep 20

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

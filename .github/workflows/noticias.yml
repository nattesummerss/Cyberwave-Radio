# Cyberwave Radio: publica o site no GitHub Pages e atualiza as notícias da apresentadora.
#
# O navegador não pode ler os sites de notícia diretamente (eles bloqueiam outros sites),
# então o próprio GitHub busca as manchetes a cada 15 minutos e grava o arquivo
# noticias.json junto com o site.
#
# Para funcionar: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Este arquivo precisa ficar exatamente em .github/workflows/noticias.yml no repositório.
# A cada execução, a aba Actions mostra um resumo com o status de cada fonte.
# Uma vez por dia o GitHub também procura rádios novas para as abas (radios-extras.json; ver o passo
# "Descobrir rádios novas", todas as abas desde a v34; desde a v42 as rádios de esporte do Brasil passam na frente). A cada 6 horas atualiza os episódios da seção Podcasts
# (podcasts.json) e, a cada 7 dias, procura podcasts e audiolivros novos cujo áudio toca na rede da empresa (AVD);
# desde a v41 são 146 buscas em 12 abas, feitas aos poucos, e os programas achados se acumulam.
# Se uma execução falhar, a próxima (a cada 15 minutos) publica de novo sozinha. Para não esperar, use
# Actions → "Cyberwave Radio - site e notícias" → Run workflow; "Re-run jobs" também funciona (v28).

name: Cyberwave Radio - site e notícias

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - id: pages
        uses: actions/configure-pages@v6

      - name: Buscar manchetes (CNN Brasil, BBC News Brasil, Fox News, Revista Oeste, Ancapsu)
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          cat > /tmp/noticias.mjs <<'SCRIPT'
          import { writeFileSync, appendFileSync } from "node:fs";

          const gnews = (q, lang) =>
            lang === "en"
              ? "https://news.google.com/rss/search?q=" + encodeURIComponent(q) + "&hl=en-US&gl=US&ceid=US:en"
              : "https://news.google.com/rss/search?q=" + encodeURIComponent(q) + "&hl=pt-BR&gl=BR&ceid=BR:pt-419";

          // Fontes. Cada uma tenta os endereços em ordem e usa o primeiro que responder.
          // O último endereço (Google Notícias) é o plano B quando o site bloqueia os servidores do GitHub.
          // Manter igual à lista NEWS_SOURCES em src/lib/news.ts.
          const SOURCES = [
            { id: "cnn", name: "CNN Brasil", lang: "pt", maxAgeDays: 3, urls: ["https://www.cnnbrasil.com.br/internacional/feed/", "https://www.cnnbrasil.com.br/feed/", gnews("site:cnnbrasil.com.br when:2d", "pt")] },
            { id: "bbc", name: "BBC News Brasil", lang: "pt", maxAgeDays: 3, urls: ["https://feeds.bbci.co.uk/portuguese/rss.xml"] },
            { id: "fox", name: "Fox News", lang: "en", maxAgeDays: 3, urls: ["https://moxie.foxnews.com/google-publisher/world.xml", "https://moxie.foxnews.com/google-publisher/latest.xml", gnews("site:foxnews.com when:2d", "en")] },
            { id: "oeste", name: "Revista Oeste", lang: "pt", maxAgeDays: 3, urls: ["https://revistaoeste.com/mundo/feed/", "https://revistaoeste.com/feed/", gnews("site:revistaoeste.com when:2d", "pt")] },
            { id: "ancapsu", name: "Ancapsu", lang: "pt", maxAgeDays: 14, urls: ["https://www.youtube.com/feeds/videos.xml?channel_id=UCLTWPE7XrHEe8m_xAmNbQ-Q"] },
          ];
          const PER_SOURCE = 8;
          const DAY_MS = 24 * 60 * 60 * 1000;
          const OUT = process.argv[2] || "noticias.json";
          const SITE_URL = String(process.env.SITE_URL || "").replace(/\/+$/, "");
          const UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36 CyberwaveRadio/1.0";
          const BREAKING = /(^|[^\p{L}\p{N}])(urgente|plant[aã]o|[uú]ltima hora|ao vivo|alerta|breaking|live updates?|just in|developing)(?=$|[^\p{L}\p{N}])/iu;

          const ENT = { amp: "&", lt: "<", gt: ">", quot: '"', apos: "'", nbsp: " " };
          const entities = (s) =>
            s.replace(/&(#x[0-9a-f]+|#\d+|[a-z]+);/gi, (all, c) => {
              if (c[0] === "#") {
                const n = c[1] === "x" || c[1] === "X" ? parseInt(c.slice(2), 16) : parseInt(c.slice(1), 10);
                return n > 0 && n < 0x110000 ? String.fromCodePoint(n) : "";
              }
              return ENT[c.toLowerCase()] ?? all;
            });
          const text = (s) =>
            entities(entities(String(s ?? "").replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, "$1")).replace(/<[^>]*>/g, " "))
              .replace(/<[^>]*>/g, " ")
              .replace(/\s+/g, " ")
              .trim();
          const tag = (block, name) => {
            const m = new RegExp(`<${name}(?:\\s[^>]*)?>([\\s\\S]*?)</${name}>`, "i").exec(block);
            return m ? m[1] : "";
          };
          const okLink = (u) => {
            try {
              const url = new URL(u);
              return url.protocol === "https:" || url.protocol === "http:" ? url.href : "";
            } catch {
              return "";
            }
          };

          // Google Notícias põe " - Nome do veículo" no fim do título.
          const tidyTitle = (title, url) => (url.startsWith("https://news.google.com/") ? title.replace(/\s+[-–]\s+[^-–]{2,40}$/, "") : title);

          function parse(xml, url) {
            const atom = /<feed[\s>]/i.test(xml) && /<entry[\s>]/i.test(xml);
            const re = atom ? /<entry[\s>][\s\S]*?<\/entry>/gi : /<item[\s>][\s\S]*?<\/item>/gi;
            const out = [];
            for (const [block] of xml.matchAll(re)) {
              const title = tidyTitle(text(tag(block, "title")), url).slice(0, 280);
              let link = "";
              if (atom) {
                link = (/<link[^>]*rel=["']alternate["'][^>]*href=["']([^"']+)["']/i.exec(block) || /<link[^>]*href=["']([^"']+)["']/i.exec(block) || [])[1] || "";
                link = entities(link);
              } else {
                link = text(tag(block, "link")) || text(tag(block, "guid"));
              }
              const when = Date.parse(text(tag(block, "pubDate") || tag(block, "published") || tag(block, "updated") || tag(block, "dc:date")));
              link = okLink(link);
              if (!title || !link) continue;
              out.push({ title, link, publishedAt: Number.isFinite(when) ? when : null });
            }
            return out;
          }

          async function load(src) {
            let lastError = "sem resposta";
            for (const url of src.urls) {
              try {
                const res = await fetch(url, {
                  headers: { "user-agent": UA, accept: "application/rss+xml, application/atom+xml, application/xml, text/xml;q=0.9, */*;q=0.8" },
                  redirect: "follow",
                  signal: AbortSignal.timeout(20000),
                });
                if (!res.ok) {
                  lastError = `HTTP ${res.status}`;
                  continue;
                }
                const items = parse(await res.text(), url);
                if (items.length === 0) {
                  lastError = "feed vazio";
                  continue;
                }
                return { items, url };
              } catch (err) {
                lastError = err && err.name === "TimeoutError" ? "tempo esgotado" : String(err && err.message || err).slice(0, 120);
              }
            }
            throw new Error(lastError);
          }

          // Manchetes publicadas na execução anterior: se uma fonte falhar agora, reaproveita as dela.
          async function previous() {
            if (!SITE_URL) return [];
            try {
              const res = await fetch(SITE_URL + "/noticias.json?t=" + Date.now(), { headers: { "user-agent": UA }, signal: AbortSignal.timeout(15000) });
              if (!res.ok) {
                console.log("Arquivo anterior: HTTP " + res.status + " (normal na primeira execução)");
                return [];
              }
              const data = await res.json();
              return Array.isArray(data && data.items) ? data.items : [];
            } catch (err) {
              console.log("Arquivo anterior: indisponível (" + String((err && err.message) || err).slice(0, 80) + ")");
              return [];
            }
          }
          // Mensagem segura para as anotações do GitHub (sem quebras de linha nem %).
          const note = (s) => String(s).replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");

          const now = Date.now();
          const old = await previous();
          const sources = [];
          const items = [];
          await Promise.all(
            SOURCES.map(async (src) => {
              const recent = (i) => i.publishedAt === null || (now - i.publishedAt < src.maxAgeDays * DAY_MS && i.publishedAt - now < 60 * 60 * 1000);
              try {
                const { items: got, url } = await load(src);
                const fresh = got
                  .filter(recent)
                  .sort((a, b) => (b.publishedAt ?? 0) - (a.publishedAt ?? 0))
                  .slice(0, PER_SOURCE);
                for (const i of fresh) {
                  items.push({ source: src.id, sourceName: src.name, lang: src.lang, title: i.title, link: i.link, publishedAt: i.publishedAt, breaking: BREAKING.test(i.title) });
                }
                sources.push({ id: src.id, name: src.name, ok: true, count: fresh.length, feed: url });
                console.log("OK    " + src.name + ": " + fresh.length + " manchetes (" + url + ")");
              } catch (err) {
                const error = String((err && err.message) || err).slice(0, 120);
                const kept = old
                  .filter((i) => i && i.source === src.id && typeof i.title === "string" && typeof i.link === "string")
                  .map((i) => ({ ...i, publishedAt: typeof i.publishedAt === "number" ? i.publishedAt : null }))
                  .filter((i) => i.publishedAt !== null && recent(i))
                  .slice(0, PER_SOURCE);
                items.push(...kept);
                sources.push({ id: src.id, name: src.name, ok: false, count: kept.length, error, kept: kept.length > 0 });
                console.log("FALHA " + src.name + ": " + error + (kept.length ? " (mantidas " + kept.length + " manchetes da execução anterior)" : ""));
                console.log("::warning title=Fonte sem resposta::" + note(src.name + ": " + error));
              }
            }),
          );
          sources.sort((a, b) => SOURCES.findIndex((s) => s.id === a.id) - SOURCES.findIndex((s) => s.id === b.id));
          items.sort((a, b) => (b.publishedAt ?? 0) - (a.publishedAt ?? 0));
          writeFileSync(OUT, JSON.stringify({ updatedAt: new Date(now).toISOString(), sources, items }, null, 1));
          console.log(items.length + " manchetes gravadas em " + OUT);
          if (items.length === 0) {
            console.log("::error title=Nenhuma manchete::" + note("Nenhuma fonte respondeu. O site vai tentar a conexão direta pelo navegador."));
          }

          // Resumo na página da execução (aba Actions)
          if (process.env.GITHUB_STEP_SUMMARY) {
            const esc = (s) => String(s).replace(/[|<>]/g, " ");
            const rows = sources.map((s) =>
              "| " + esc(s.name) + " | " + (s.ok ? "✅ OK" : "❌ Falhou") + " | " + s.count + " | " + esc(s.ok ? s.feed : s.error + (s.kept ? " (manchetes anteriores mantidas)" : "")) + " |",
            );
            appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              ["### Notícias da Cyberwave Radio", "", "| Fonte | Status | Manchetes | Detalhe |", "|---|---|---|---|", ...rows, "", "**Total:** " + items.length + " manchetes", ""].join("\n"),
            );
          }
          SCRIPT
          node /tmp/noticias.mjs noticias.json

      # ---------- Voz da ANDRA-18 ----------
      # Grava as falas e as manchetes em MP3 com uma voz neural feminina, para a apresentadora ter
      # a mesma voz em qualquer aparelho e navegador. Os áudios ficam guardados entre execuções e
      # só os textos novos são gravados de novo.
      #
      # Voz: Microsoft Azure AI Speech (oficial; plano gratuito F0 de 500 mil caracteres/mês) quando
      # os segredos AZURE_SPEECH_KEY e AZURE_SPEECH_REGION estiverem cadastrados em
      # Settings → Secrets and variables → Actions. Sem os segredos, usa o pacote edge-tts
      # (mesmas vozes neurais, sem cadastro, serviço não oficial que pode parar sem aviso).
      # Trocar a voz: variável ANDRA_VOZ (ex.: pt-BR-FranciscaNeural).
      # Idiomas (v35): cada fala é dividida em trechos por idioma com o mesmo código do site (bloco andra-idioma do
      # index.html, src/lib/andra-lang.ts). Nomes de rádios e músicas e manchetes em inglês/espanhol/etc. são gravados
      # na voz feminina daquele idioma e juntados num MP3 só. Vozes: ANDRA_VOZ_EN (padrão en-US-AvaNeural) e
      # ANDRA_VOZ_ES (padrão es-MX-DaliaNeural). Com Azure e voz Multilingual, a própria voz troca de idioma.
      # Se esta etapa falhar, o site é publicado assim mesmo e usa a voz feminina do navegador.
      - name: Restaurar áudios já gravados
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/cyberwave-voz
          key: voz-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: voz-

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Rádios novas a cada 24 h: o GitHub procura no diretório público Radio Browser rádios da StreamTheWorld
      # (as únicas que tocam na rede da empresa/AVD) para as abas R&B, Rock internacional, Esportes, Internacionais
      # e Web e outras cidades, confere se cada uma toca e publica radios-extras.json junto com o site.
      # O site junta essas rádios às abas (selo NOVA nos primeiros 3 dias). Resumo de cada busca na aba Actions.
      # Variáveis opcionais (Settings → Secrets and variables → Actions → Variables):
      #   RADIOS_NOVAS_POR_DIA      quantas rádios novas por aba a cada busca (padrão 5; 0 = só confere as que já entraram)
      #   RADIOS_NOVAS_MAXIMO       limite de rádios descobertas por aba (padrão 100)
      #   RADIOS_NOVAS_A_CADA_HORAS intervalo entre as buscas (padrão 24)
      - name: Restaurar as rádios descobertas
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/cyberwave-descobertas
          key: descobertas-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: descobertas-

      - name: Descobrir rádios novas (a cada 24 h)
        id: descobrir
        continue-on-error: true
        timeout-minutes: 8
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          RADIOS_NOVAS_POR_DIA: ${{ vars.RADIOS_NOVAS_POR_DIA }}
          RADIOS_NOVAS_MAXIMO: ${{ vars.RADIOS_NOVAS_MAXIMO }}
          RADIOS_NOVAS_A_CADA_HORAS: ${{ vars.RADIOS_NOVAS_A_CADA_HORAS }}
        run: |
          cat > /tmp/descobrir.py <<'SCRIPT'
          # Descobre rádios novas para TODAS as abas do site, uma vez a cada 24 h (variável RADIOS_NOVAS_A_CADA_HORAS).
          # Fonte: diretório público Radio Browser, buscando por estilo (R&B, trap, rock, esportes...) e por país (Brasil).
          # Nas abas normais só entram rádios da StreamTheWorld: são as únicas que tocam na rede da empresa (AVD) - teste
          # de 19/11/2026. São Paulo, Rio e BH (v34) recebem rádios dessas cidades (com a frequência, quando o nome traz).
          # A aba "Fora da empresa" (v34) recebe rádios de outros servidores (https), que tocam no celular e em casa.
          # Cada candidata é conferida antes de entrar (a StreamTheWorld confirma que existe e o áudio responde).
          # As rádios já descobertas são conferidas de novo a cada busca; saem depois de 3 buscas seguidas sem áudio.
          # Resultado: radios-extras.json, publicado junto com o site (o site junta essas rádios às abas).
          # v42: rádios de esporte do Brasil primeiro (buscas próprias no diretório; nas abas Esportes e "Fora da empresa" elas
          # passam na frente) e, uma vez por semana, palpites de rádios de esporte do Brasil na StreamTheWorld (PALPITES).
          import concurrent.futures as cf, gzip, hashlib, json, os, re, socket, sys, time, unicodedata, urllib.error, urllib.parse, urllib.request
          socket.setdefaulttimeout(20)
          from datetime import datetime, timezone
          from pathlib import Path

          CACHE = Path(os.path.expanduser(os.environ.get("DESCOBERTAS_CACHE") or "~/.cache/cyberwave-descobertas")); CACHE.mkdir(parents=True, exist_ok=True)
          STATE = CACHE / "estado.json"
          OUT = Path("radios-extras.json")

          def num(name, default, lo, hi):
              try: v = float(os.environ.get(name) or default)
              except ValueError: v = default
              return max(lo, min(hi, v))

          EVERY_H = num("RADIOS_NOVAS_A_CADA_HORAS", 24, 1, 24 * 30)
          PER_DAY = int(num("RADIOS_NOVAS_POR_DIA", 5, 0, 30))
          MAX_TAB = int(num("RADIOS_NOVAS_MAXIMO", 100, 0, 300))
          SITE_URL = (os.environ.get("SITE_URL") or "").strip()
          UA = "Mozilla/5.0 (CyberwaveRadio; descoberta de radios; +https://github.com)"
          STW = "https://playerservices.streamtheworld.com/api/livestream-redirect/"
          TABS = ["sp", "rj", "bh", "rnb", "rock", "sports", "intl", "web", "fora"]
          TAB_NAME = {"sp": "São Paulo", "rj": "Rio de Janeiro", "bh": "Belo Horizonte", "rnb": "R&B", "rock": "Rock internacional", "sports": "Esportes",
                      "intl": "Internacionais", "web": "Web e outras cidades", "fora": "Fora da empresa"}
          CITY_TABS = ("sp", "rj", "bh")
          SEARCH_V = 42     # versão da busca (v42: esporte do Brasil). Mudou = busca já, sem esperar as 24 h.
          RETRY_DAYS = 14   # candidata que falhou só é tentada de novo depois disso
          MAX_FAILS = 3     # buscas seguidas sem áudio até a rádio sair
          BUDGET_S = 300    # tempo máximo de conferência por execução
          AUDIO_CT = re.compile(r"audio/|application/ogg|video/mp2t|application/octet-stream|aacp", re.I)
          PLAYLIST_CT = re.compile(r"mpegurl|x-scpls|pls", re.I)
          URL_OK = re.compile(r"^https://playerservices\.streamtheworld\.com/api/livestream-redirect/[A-Za-z0-9_]{3,40}\.(aac|mp3)$")
          # Aba "Fora da empresa": qualquer servidor https (menos a StreamTheWorld), sem lista de reprodução e sem senha/token no endereço.
          WEB_URL_OK = re.compile(r"^https://(?![^/]*streamtheworld\.com)[A-Za-z0-9.-]+\.[A-Za-z]{2,}(?::\d{2,5})?/[^\s\"'<>\\{}|^`]{0,250}$")
          TOKEN_Q = re.compile(r"token|signature|expires|sig=|auth|session|key=|password|passwd", re.I)
          PLAYLIST_EXT = re.compile(r"\.(m3u8?|pls|asx|xspf)(\?|$)", re.I)
          ID_OK = re.compile(r"^extra-[a-z0-9-]{2,60}$")

          def now_iso(t=None): return datetime.fromtimestamp(time.time() if t is None else t, timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          def parse_iso(s):
              try: return datetime.strptime(str(s), "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc).timestamp()
              except Exception: return 0.0
          def fold(t): return "".join(c for c in unicodedata.normalize("NFD", (t or "").lower()) if unicodedata.category(c) != "Mn")
          def name_key(name, place): return re.sub(r"[^a-z0-9]+", "", fold(name)) + "|" + re.sub(r"[^a-z0-9]+", "", fold(place))

          # ---------- Endereços da StreamTheWorld ----------

          STW_HOST = re.compile(r"^(?:[a-z0-9-]+\.)*streamtheworld\.com$", re.I)
          SKIP_SEG = {"api", "livestream-redirect", "livestream", "pls", "m3u", "xspf", "hls", "playlist.m3u8", "ondemand"}

          def mount_of(url):
              """Ponto de montagem (ex.: WQHTFMAAC) de um endereço da StreamTheWorld; None para outros servidores."""
              try: u = urllib.parse.urlsplit((url or "").strip())
              except ValueError: return None
              if u.scheme not in ("http", "https") or not STW_HOST.match(u.hostname or ""): return None
              q = urllib.parse.parse_qs(u.query)
              cand = (q.get("mount") or q.get("callsign") or [""])[0]
              if not cand:
                  segs = [s for s in u.path.split("/") if s and s.lower() not in SKIP_SEG]
                  cand = segs[0] if segs else ""
              cand = re.sub(r"\.(aac|mp3|pls|m3u8?|xspf|flv|mp4)$", "", cand, flags=re.I)
              cand = re.sub(r"_SC$", "", cand, flags=re.I)
              return cand if re.fullmatch(r"[A-Za-z0-9_]{3,40}", cand) else None

          def key_of(mount):
              """Mesma rádio em formatos diferentes (WRATFMAACIHR, WRATFM) vira a mesma chave. Igual a mountKey() no site."""
              k = re.sub(r"_SC$", "", mount.upper())
              for _ in range(3):
                  n = re.sub(r"_(?:24|32|40|48|56|64|96|128|192)$", "", re.sub(r"(?:IHR|_ADP|_?AAC\d?|_MP3)$", "", k))
                  if n == k or len(n) < 3: break
                  k = n
              return k

          # ---------- Estilo (aba), gênero e lugar ----------

          RELIG = re.compile(r"christ|gospel|relig|cathol|catol|catól|worship|church|igreja|iglesia|evangel|bibl|jesus|praise|louvor|adventist|islam|quran|coran|cristã|cristia|catequ|bible|pentecost|kirche", re.I)
          SPORTS = {"sports", "sport", "sports talk", "sports radio", "sports news", "deportes", "deporte", "esportes", "esporte", "futebol", "futbol",
                    "fútbol", "football", "soccer", "espn", "fox sports", "nfl", "nba", "mlb", "nhl", "baseball", "béisbol", "beisbol", "basketball", "hockey"}
          NAME_SPORTS = re.compile(r"\b(espn|sports?|deportes?|esportes?|esportiv[ao]s?|futebol|the fan|the ticket|the score|tudn|fox sports)\b", re.I)
          # Estados do Brasil (lugar das rádios descobertas antes da v42, que não traziam a marca "br").
          BR_PLACES = {"brasil", "acre", "alagoas", "amapa", "amazonas", "bahia", "ceara", "distrito federal", "espirito santo", "goias", "maranhao",
                       "mato grosso", "mato grosso do sul", "minas gerais", "para", "paraiba", "parana", "pernambuco", "piaui", "rio de janeiro",
                       "rio grande do norte", "rio grande do sul", "rondonia", "roraima", "santa catarina", "sao paulo", "sergipe", "tocantins"}
          SPORT_GENRES = {"Esportes", "Notícias e esportes", "Esportes em espanhol"}
          RNB = {"rnb", "r&b", "r'n'b", "r n b", "r & b", "rhythm and blues", "soul", "neo soul", "neo-soul", "classic soul", "hip hop", "hip-hop", "hiphop", "rap",
                 "urban", "urban contemporary", "urban ac", "urban adult contemporary", "old school", "old school hip hop", "slow jams", "quiet storm",
                 "hip hop/r&b", "r&b/hip hop", "hip-hop/r&b", "trap", "rhythmic", "rhythmic contemporary", "motown", "funk soul"}
          ROCK = {"rock", "classic rock", "hard rock", "alternative", "alternative rock", "active rock", "modern rock", "mainstream rock", "album rock", "aor",
                  "heavy metal", "metal", "punk", "punk rock", "grunge", "indie rock", "rock en español", "rock en espanol", "rock nacional", "rock and roll",
                  "rock'n'roll", "rock n roll", "rock & roll", "progressive rock", "southern rock", "post-grunge", "nu metal", "metalcore", "thrash metal",
                  "death metal", "hardcore", "classic metal", "80s rock", "90s rock", "alt rock", "rock alternativo", "rock clásico", "rock clasico", "pop rock"}
          POPISH = {"pop", "top 40", "top40", "hits", "top hits", "chr", "adult contemporary", "hot ac", "ac", "variety", "80s", "90s", "70s", "oldies", "classic hits",
                    "dance", "latin", "latin pop", "news", "talk", "news talk", "noticias", "notícias", "baladas", "romantica", "romántica", "country", "jazz", "mpb"}

          COUNTRY_PT = {"US": "EUA", "MX": "México", "CA": "Canadá", "AR": "Argentina", "CL": "Chile", "CO": "Colômbia", "PE": "Peru", "EC": "Equador",
                        "UY": "Uruguai", "PY": "Paraguai", "BO": "Bolívia", "VE": "Venezuela", "CR": "Costa Rica", "GT": "Guatemala", "PA": "Panamá",
                        "DO": "República Dominicana", "PR": "Porto Rico", "SV": "El Salvador", "HN": "Honduras", "NI": "Nicarágua", "CU": "Cuba",
                        "ES": "Espanha", "PT": "Portugal", "GB": "Reino Unido", "IE": "Irlanda", "FR": "França", "DE": "Alemanha", "IT": "Itália",
                        "NL": "Holanda", "BE": "Bélgica", "AU": "Austrália", "NZ": "Nova Zelândia", "ZA": "África do Sul"}

          def tags_of(r): return {t.strip().lower() for t in (r.get("tags") or "").split(",") if t.strip()}

          # Cidades das abas com dial (v34). Nome completo da cidade no nome da rádio basta; sigla (SP, RJ, BH) ou ponto de
          # montagem (NOVABRASIL_SPAAC, CBN_BHAAC...) só valem se o estado bater (ou não vier no diretório).
          CITY = {
              "sp": (re.compile(r"\b(sao paulo|sampa)\b"), re.compile(r"\bsp\b"), re.compile(r"SAOPAULO|SAO_PAULO|_SP(?=AAC|MP3|_|\d|$)|SP(?=AAC$)"), ("sao paulo",)),
              "rj": (re.compile(r"\brio de janeiro\b"), re.compile(r"\b(rj|rio(?! (grande|preto|claro|verde|branco|negro|bonito|largo|do sul|pardo)))\b"),
                     re.compile(r"_RJ(?=AAC|MP3|_|\d|$)|RJ(?=AAC$)|_RIO(?=AAC|MP3|_|\d|$)|^RIO(?=AAC|_|$)"), ("rio de janeiro",)),
              "bh": (re.compile(r"\bbelo horizonte\b"), re.compile(r"\bbh\b"), re.compile(r"BELOHORIZONTE|_BH(?=AAC|MP3|_|\d|$)|^BH(?=FM|AAC)"), ("minas gerais", "belo horizonte")),
          }

          def city_of(name, mount, state):
              """Aba de cidade (sp/rj/bh) de uma rádio do Brasil; None se não der para ter certeza."""
              n = " " + re.sub(r"[^a-z0-9]+", " ", fold(name or "")) + " "
              st, m = re.sub(r"[^a-z ]+", " ", fold(state or "")).strip(), (mount or "").upper()
              for c, (full, short, mt, states) in CITY.items():
                  state_ok = not st or st in ("brasil", "brazil") or any(x in st for x in states)
                  if full.search(n) or ((short.search(n) or mt.search(m)) and state_ok):
                      return c
              return None

          FREQ = re.compile(r"(?<![\d.,])(8[7-9]|9\d|10[0-7])[.,]([1-9])(?!\d)")

          def freq_of(name):
              """Frequência FM escrita no nome (ex.: "Rádio X 98.1 FM" -> 98.1); None se não tiver."""
              for m in FREQ.finditer(name or ""):
                  f = float(f"{m.group(1)}.{m.group(2)}")
                  if 87.5 <= f <= 107.9: return f
              return None

          def classify(r):
              """Aba da rádio: sports, web (Brasil), rnb, rock ou intl; None = fora do catálogo (religiosa, país desconhecido)."""
              tags, name = tags_of(r), r.get("name") or ""
              if any(RELIG.search(t) for t in tags) or RELIG.search(name): return None
              cc = (r.get("countrycode") or "").upper()
              if tags & SPORTS or NAME_SPORTS.search(name): return "sports"
              if cc == "BR": return "web"   # a aba Rock é "Rock internacional": rádios do Brasil ficam em "Web e outras cidades"
              if not re.fullmatch(r"[A-Z]{2}", cc): return None
              rnb, rock, pop = len(tags & RNB), len(tags & ROCK), len(tags & POPISH)
              if rnb and not rock and rnb >= pop: return "rnb"
              if rock and not rnb and rock >= pop: return "rock"
              return "intl"

          def genre_of(tab, r):
              tags = tags_of(r)
              has = lambda *ts: any(t in tags for t in ts)
              if tab == "sports":
                  talk = has("news", "talk", "news talk", "noticias", "notícias", "informacion", "información", "jornalismo")
                  spanish = "spanish" in (r.get("language") or "").lower() and (r.get("countrycode") or "").upper() == "US"
                  return "Esportes em espanhol" if spanish else "Notícias e esportes" if talk else "Esportes"
              if tab == "rnb":
                  hh = has("hip hop", "hip-hop", "hiphop", "rap", "trap", "urban", "rhythmic", "rhythmic contemporary", "hip hop/r&b", "r&b/hip hop")
                  rb = has("rnb", "r&b", "r'n'b", "r n b", "r & b", "rhythm and blues", "slow jams", "quiet storm", "urban ac", "urban adult contemporary")
                  soul = has("soul", "neo soul", "neo-soul", "classic soul", "motown", "funk soul")
                  if has("trap", "drill"): return "Trap e hip-hop"
                  if hh and (rb or soul): return "Hip-hop e R&B"
                  if hh: return "Hip-hop"
                  if rb and soul: return "R&B e soul"
                  return "Soul" if soul and not rb else "R&B"
              if tab == "rock":
                  if has("rock en español", "rock en espanol"): return "Rock em espanhol"
                  if has("metal", "heavy metal", "metalcore", "nu metal", "thrash metal", "death metal", "classic metal"):
                      return "Metal e hard rock" if has("hard rock", "active rock") else "Metal"
                  if has("hard rock", "active rock"): return "Hard rock"
                  if has("classic rock", "album rock", "aor", "80s rock", "rock clásico", "rock clasico"): return "Classic rock"
                  if has("alternative", "alternative rock", "modern rock", "indie rock", "alt rock", "rock alternativo", "grunge", "post-grunge"): return "Alternativo"
                  if has("punk", "punk rock", "hardcore"): return "Punk"
                  if has("pop rock"): return "Pop rock"
                  return "Rock"
              rules = [
                  (("news", "talk", "news talk", "noticias", "notícias", "jornalismo", "informacion", "información", "talk radio"), "Notícias"),
                  (("mpb",), "MPB"), (("sertanejo",), "Sertanejo"), (("pagode", "samba"), "Samba e pagode"), (("forró", "forro"), "Forró"),
                  (("pop rock",), "Pop rock"), (("rock", "classic rock", "rock nacional"), "Pop rock" if has("pop") else "Rock"), (("jazz", "smooth jazz"), "Jazz"), (("blues",), "Blues"),
                  (("classical", "clássica", "classica", "música clássica", "musica clasica"), "Clássica"), (("country",), "Country"),
                  (("regional mexicano", "regional mexicana", "banda", "norteño", "norteno", "grupera"), "Regional mexicana"),
                  (("reggaeton",), "Reggaeton"), (("salsa", "tropical", "cumbia", "merengue", "bachata", "vallenato"), "Tropical"),
                  (("flamenco",), "Flamenco"), (("latin", "latino", "latin pop", "latina", "musica latina"), "Latina"),
                  (("80s",), "Anos 80"), (("90s",), "Anos 90"), (("70s",), "Anos 70"),
                  (("oldies", "classic hits", "clasicos", "clásicos", "flashback", "retro"), "Clássicos"),
                  (("dance", "electronic", "edm", "house", "techno", "eletrônica", "electronica"), "Dance"),
                  (("hip hop", "rnb", "r&b", "soul", "urban"), "Hip-hop e R&B"),
                  (("adult contemporary", "ac", "hot ac", "soft", "easy listening", "romantic", "romantica", "romántica", "baladas"), "Adulto"),
                  (("pop", "top 40", "top40", "hits", "chr", "top hits"), "Pop"),
              ]
              for ts, label in rules:
                  if has(*ts): return label
              return "Variedades"

          def clean_text(t, limit):
              t = unicodedata.normalize("NFC", t or "")
              t = "".join(c for c in t if unicodedata.category(c) not in ("Cc", "Cf", "Cs", "Co", "So", "Sk") and c not in "<>{}\\")
              return re.sub(r"\s+", " ", t).strip()[:limit]

          def clean_name(n):
              n = clean_text(n, 200)
              n = re.sub(r"\s*[\(\[](?:aac\+?|mp3|hq|lq|hd|\d{2,3}\s*k(?:bps)?|stereo|low|high|128|64|48)[\)\]]", "", n, flags=re.I)
              n = re.sub(r"(?:^|\s)(?:aac\+?|mp3|\d{2,3}\s*kbps)(?=\s|$)", " ", n, flags=re.I)
              n = re.sub(r"\s+", " ", n).strip(" -–—|·:_/").rstrip(".")   # ponto inicial fica (".977 Hitz")
              if len(n) > 48:
                  for sep in (" - ", " – ", " — ", " | ", ": "):
                      head = n.split(sep)[0].strip()
                      if sep in n and len(head) >= 3: n = head; break
              if len(n) > 48: n = n[:47].rstrip() + "…"
              return n

          def place_of(r):
              cc = (r.get("countrycode") or "").upper()
              if cc == "BR":
                  st = clean_text(r.get("state"), 40)
                  if st.islower(): st = st.title()
                  return st if len(st) >= 2 and fold(st) not in ("brazil", "brasil") else "Brasil"
              return COUNTRY_PT.get(cc) or clean_text(r.get("country"), 40) or "Web"

          def fala_of(name, place):
              """Mesmo texto que spokenStation() do site: 'Você está ouvindo <rádio>, de <lugar>.'"""
              n = re.sub(r"^\.", "ponto ", name)
              n = re.sub(r"\s*\((?:via|iHeart)[^)]*\)", "", n, flags=re.I).replace("!", "")
              return f"Você está ouvindo {n}{', de ' + place if place and place != 'Web' else ''}."

          # ---------- Rede ----------

          RB_HOSTS = ["de1", "de2", "fi1", "nl1", "at1", "all"]

          def radio_browser(params):
              q = urllib.parse.urlencode({**params, "hidebroken": "true", "order": "clickcount", "reverse": "true"})
              for h in list(RB_HOSTS):
                  try:
                      req = urllib.request.Request(f"https://{h}.api.radio-browser.info/json/stations/search?{q}", headers={"User-Agent": UA, "Accept-Encoding": "gzip"})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          data = r.read(40 * 1024 * 1024)
                      if data[:2] == b"\x1f\x8b": data = gzip.decompress(data)
                      rows = json.loads(data.decode("utf-8", "replace"))
                      if isinstance(rows, list):
                          RB_HOSTS.remove(h); RB_HOSTS.insert(0, h)   # servidor que respondeu vai para o começo da fila
                          return rows
                  except Exception as e:
                      print(f"  Radio Browser {h}: {type(e).__name__}")
              return None

          def looks_audio(b):
              return b[:3] == b"ID3" or b[:4] == b"OggS" or any(b[i] == 0xFF and (b[i + 1] & 0xF0) == 0xF0 for i in range(min(len(b) - 1, 4096)))

          def probe(url, depth=0, https_only=False):
              """True/False e motivo: o endereço responde com áudio?"""
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": UA, "Icy-MetaData": "0", "Accept": "*/*"})
                  with urllib.request.urlopen(req, timeout=12) as r:
                      ct = r.headers.get("Content-Type", "")
                      if https_only and not str(r.geturl() or url).startswith("https://"): return False, "redireciona para http (o site bloqueia)"
                      if PLAYLIST_CT.search(ct) and https_only: return False, "lista de reprodução (não toca direto no site)"
                      if PLAYLIST_CT.search(ct) and depth == 0:
                          links = re.findall(r"https?://[^\s\"'<>]+", r.read(65536).decode("utf-8", "replace"))
                          return probe(links[0], 1) if links else (False, "lista sem endereço")
                      data, t0 = b"", time.time()
                      while len(data) < 12288 and time.time() - t0 < 10:
                          chunk = r.read(4096)
                          if not chunk: break
                          data += chunk
                      if "text/html" in ct.lower(): return False, "respondeu uma página, não áudio"
                      if len(data) < 4096: return False, f"pouco áudio ({len(data)} bytes)"
                      if not (AUDIO_CT.search(ct) or looks_audio(data)): return False, f"tipo inesperado ({ct[:40]})"
                      return True, ""
              except urllib.error.HTTPError as e:
                  return False, f"HTTP {e.code}"
              except Exception as e:
                  return False, type(e).__name__

          def provision(mount):
              """Código da StreamTheWorld (200 = no ar; 404 = não existe; 453 = bloqueada no país), codec e kbps."""
              req = urllib.request.Request(f"https://playerservices.streamtheworld.com/api/livestream?version=1.10&mount={urllib.parse.quote(mount)}&lang=en", headers={"User-Agent": UA})
              xml = urllib.request.urlopen(req, timeout=12).read(131072).decode("utf-8", "replace")
              code = re.search(r"<status-code>\s*(\d{3})\s*</status-code>", xml)
              codec = re.search(r'<audio\b[^>]*\bcodec="([^"]+)"', xml)
              kbps = re.search(r'<audio\b[^>]*\bbitrate="(\d+)"', xml)
              return (code.group(1) if code else "?"), (codec.group(1).lower() if codec else ""), (int(kbps.group(1)) // 1000 if kbps else None)

          def verify(st):
              """Confere uma rádio: a StreamTheWorld diz que está no ar e o endereço responde com áudio. Devolve (ok, motivo, rádio).
              Rádio de outro servidor (aba "Fora da empresa", v34): o endereço https responde com áudio."""
              if not st.get("mount"):
                  if not WEB_URL_OK.match(st.get("url") or ""): return False, "endereço inválido", st
                  ok, why = probe(st["url"], https_only=True)
                  return (True, "", dict(st)) if ok else (False, why, st)
              try: code, codec, kbps = provision(st["mount"])
              except Exception as e: return False, f"StreamTheWorld não respondeu ({type(e).__name__})", st
              if code != "200": return False, "StreamTheWorld " + code + {"404": " (não existe)", "453": " (bloqueada no país do GitHub)"}.get(code, ""), st
              ext = "mp3" if "mp3" in codec else "aac" if codec else st.get("ext", "aac")
              url = f"{STW}{st['mount']}.{ext}"
              ok, why = probe(url)
              if not ok: return False, why, st
              out = dict(st, url=url, codec="MP3" if ext == "mp3" else "AAC")
              if kbps and 8 <= kbps <= 512: out["bitrate"] = kbps
              return True, "", out

          # ---------- Estado ----------

          def builtin_index():
              """Chaves e nomes das rádios que já estão no site (bloco radios-lista do index.html)."""
              keys, names = set(), set()
              try:
                  html = Path("index.html").read_text(encoding="utf-8")
                  m = re.search(r'<script type="application/json" id="radios-lista">(.*?)</script>', html, re.S)
                  for s in json.loads(m.group(1)) if m else []:
                      for u in (s.get("urls") or []) + (s.get("triton") or []):
                          mt = mount_of(u)
                          if mt: keys.add(key_of(mt))
                          elif str(u).startswith("https://"): keys.add(web_key(u))
                      names.add(re.sub(r"[^a-z0-9]+", "", fold(s.get("name", ""))))
              except Exception as e:
                  print(f"::warning title=Rádios novas::não consegui ler as rádios do site ({e})")
              return keys, names

          def from_public(item):
              """Rádio publicada (radios-extras.json) de volta para o estado interno."""
              if not isinstance(item, dict) or not ID_OK.match(str(item.get("id", ""))) or item.get("tab") not in TABS: return None
              url = str(item.get("url", ""))
              if not url_ok({"tab": item["tab"], "url": url}): return None
              mount = mount_of(url) if item["tab"] != "fora" else None
              out = {"id": item["id"], "name": clean_text(item.get("name"), 60) or item["id"], "tab": item["tab"], "genre": clean_text(item.get("genre"), 40) or "Variedades",
                     "place": clean_text(item.get("place"), 40) or "Web", "url": url, "mount": mount, "key": key_of(mount) if mount else web_key(url),
                     "codec": item.get("codec") if item.get("codec") in ("AAC", "MP3") else ("MP3" if url.endswith(".mp3") else "AAC"),
                     "bitrate": item.get("bitrate") if isinstance(item.get("bitrate"), int) else None,
                     "addedAt": item.get("addedAt") if parse_iso(item.get("addedAt")) else now_iso(), "fails": 0}
              if item["tab"] in CITY_TABS and isinstance(item.get("freq"), (int, float)) and 87.5 <= item["freq"] <= 108: out["freq"] = float(item["freq"])
              if isinstance(item.get("br"), bool): out["br"] = item["br"]
              if item["tab"] == "fora": out["sport"] = item.get("esporte") is True
              return out

          def load_state():
              try:
                  st = json.loads(STATE.read_text(encoding="utf-8"))
                  if isinstance(st, dict) and isinstance(st.get("stations"), list): return st, "cache"
              except Exception:
                  pass
              # Sem cache (primeira vez ou cache apagado pelo GitHub): recupera a lista publicada no próprio site.
              if SITE_URL:
                  try:
                      req = urllib.request.Request(SITE_URL.rstrip("/") + "/radios-extras.json", headers={"User-Agent": UA, "Cache-Control": "no-cache"})
                      pub = json.loads(urllib.request.urlopen(req, timeout=15).read(8 * 1024 * 1024).decode("utf-8"))
                      stations = [s for s in (from_public(i) for i in pub.get("stations", [])) if s]
                      if stations:
                          return {"stations": stations, "searchedAt": pub.get("updatedAt"), "nextAt": pub.get("nextAt"), "rejected": {}}, "site"
                  except Exception:
                      pass
              return {"stations": [], "rejected": {}}, "novo"

          def br_of(s):
              """Rádio do Brasil? Marca da busca (v42) ou, nas rádios antigas, a aba/lugar."""
              if isinstance(s.get("br"), bool): return s["br"]
              return s.get("tab") in CITY_TABS + ("web",) or re.sub(r"\s+", " ", fold(s.get("place") or "")).strip() in BR_PLACES

          def sport_of(s):
              """Rádio de esporte? Marca da busca (v42) ou, nas rádios antigas, a aba/gênero."""
              if isinstance(s.get("sport"), bool): return s["sport"]
              return s.get("tab") == "sports" or s.get("genre") in SPORT_GENRES

          def public(s):
              out = {k: s[k] for k in ("id", "name", "tab", "genre", "place", "url", "codec", "addedAt") if s.get(k)}
              out["br"] = br_of(s)
              if s.get("tab") == "fora" and sport_of(s): out["esporte"] = True   # v42: aparece também na aba Esportes do site
              if s.get("bitrate"): out["bitrate"] = s["bitrate"]
              if s.get("tab") in CITY_TABS and s.get("freq"): out["freq"] = s["freq"]
              out["fala"] = fala_of(s["name"], s["place"])
              return out

          def publish(state, keys):
              """Grava radios-extras.json (publicado com o site) só com rádios conferidas e que não estão no site."""
              stations = [s for s in state["stations"] if s.get("key") not in keys and url_ok(s)]
              order = {t: i for i, t in enumerate(TABS)}
              stations.sort(key=lambda s: (order.get(s["tab"], 9), -parse_iso(s.get("addedAt")), fold(s["name"])))
              data = {"updatedAt": state.get("searchedAt"), "nextAt": state.get("nextAt"), "perDay": PER_DAY, "maxPerTab": MAX_TAB,
                      "stations": [public(s) for s in stations]}
              OUT.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
              return stations

          # ---------- Busca ----------

          QUERIES = ([{"tag": t, "limit": 500} for t in ("rnb", "r&b", "soul", "hip hop", "urban", "trap", "rap")]
                     + [{"tag": t, "limit": 500} for t in ("rock", "metal", "alternative", "punk")]
                     + [{"tag": t, "limit": 400} for t in ("sports", "deportes", "esportes", "futbol")]
                     # v42: esporte do Brasil (rádios de futebol e jornalismo esportivo de todo o país)
                     + [{"countrycode": "BR", "tag": t, "limit": 300} for t in ("futebol", "esportes", "esporte", "sports", "soccer", "football")]
                     + [{"countrycode": "BR", "name": n, "limit": 200} for n in ("esporte", "futebol", "esportiva")]
                     + [{"countrycode": "BR", "limit": 2500}]
                     + [{"limit": 3000}]
                     + [{"tag": t, "limit": 300} for t in ("news", "jazz", "latin", "country", "dance", "80s")])

          # v42: palpites de rádios de esporte do Brasil na StreamTheWorld (a única plataforma que toca na AVD) que não aparecem
          # no diretório com esse endereço. Uma vez por semana o GitHub pergunta à StreamTheWorld se algum destes pontos de
          # montagem existe e responde com áudio; a rádio só entra (aba Esportes) se tocar. Os nomes seguem o padrão das rádios
          # do mesmo grupo que já tocam na AVD (RadioBandeirantesAAC, BANDNEWSFM_SPAAC, CBN_SPAAC, CBN_RJ_ADP, RADIO_GLOBO_RJAAC).
          PALPITES = [
              ("Rádio Bandeirantes Porto Alegre", "Porto Alegre", "Notícias e esportes",
               ["RADIOBANDEIRANTES_POAAAC", "RADIOBANDEIRANTESPOAAAC", "BANDEIRANTES_POAAAC", "BANDEIRANTESPOAAAC", "RADIO_BANDEIRANTES_POAAAC", "RB_POAAAC", "BAND_POAAAC"]),
              ("Rádio Bandeirantes Brasília", "Brasília", "Notícias e esportes",
               ["RADIOBANDEIRANTES_BSBAAC", "RADIOBANDEIRANTESBSBAAC", "BANDEIRANTES_BSBAAC", "RB_BSBAAC", "RADIOBANDEIRANTES_DFAAC"]),
              ("Rádio Bandeirantes Santos", "Santos", "Notícias e esportes", ["RADIOBANDEIRANTES_SANTOSAAC", "BANDEIRANTES_SANTOSAAC", "RB_SANTOSAAC"]),
              ("BandNews FM Belo Horizonte", "Belo Horizonte", "Notícias e esportes", ["BANDNEWSFM_BHAAC", "BANDNEWSFM_BH_ADP", "BANDNEWS_BHAAC"]),
              ("Jovem Pan News", "São Paulo", "Notícias e esportes", ["JP_SP_AMAAC", "JP_SP_NEWSAAC", "JOVEMPAN_NEWSAAC", "JPNEWS_SPAAC", "JOVEMPANNEWSAAC"]),
              ("CBN Brasília", "Brasília", "Notícias e esportes", ["CBN_BSBAAC", "CBN_BSB_ADP", "CBN_BRASILIAAAC", "CBN_DFAAC"]),
              ("CBN Floripa", "Florianópolis", "Notícias e esportes", ["CBN_FLOAAC", "CBN_FLO", "CBNDIARIOAAC", "CBN_DIARIOAAC", "CBN_FLORIPAAAC"]),
              ("Rádio Globo São Paulo", "São Paulo", "Esportes e pagode", ["RADIO_GLOBO_SPAAC", "RADIOGLOBO_SPAAC"]),
              ("Rádio Gaúcha", "Porto Alegre", "Notícias e esportes", ["GAUCHA_POAAAC", "GAU_POAAAC", "RADIOGAUCHAAAC", "GAUCHAAAC"]),
              ("Rádio Itatiaia", "Belo Horizonte", "Notícias e esportes", ["ITATIAIAAAC", "RADIOITATIAIAAAC", "ITATIAIA_BHAAC"]),
              ("Super Rádio Tupi", "Rio de Janeiro", "Notícias e esportes", ["SUPERRADIOTUPIAAC", "RADIOTUPIAAC", "TUPI_RJAAC"]),
          ]
          PALPITES_DAYS = 7

          def try_palpites(state, keys, taken, deadline):
              """Testa os palpites (1 vez por semana, ou na hora se a lista mudar). Devolve (rádios que tocaram, nomes testados ou None)."""
              cfg = hashlib.sha1(json.dumps(PALPITES, ensure_ascii=False).encode()).hexdigest()[:10]
              info = state.get("palpites") or {}
              if info.get("cfg") == cfg and time.time() - parse_iso(info.get("at")) < PALPITES_DAYS * 86400: return [], None
              found, tried = [], 0
              for name, place, genre, mounts in PALPITES:
                  if time.time() > deadline: return found, None          # sem tempo: tenta de novo na próxima execução
                  for mount in mounts:
                      key = key_of(mount)
                      if key in keys or key in taken: break                 # já está no site (ou já foi achada)
                      if key in state.get("rejected", {}): continue          # saiu há pouco por falta de áudio
                      tried += 1
                      ok, why, upd = verify({"mount": mount, "ext": "aac", "name": name, "place": place, "tab": "sports", "genre": genre})
                      if ok:
                          upd.update(key=key, id=slug(key), br=True, sport=True, palpite=True, addedAt=now_iso(), okAt=now_iso(), fails=0)
                          upd.pop("ext", None)
                          found.append(upd); taken.add(key)
                          break
              state["palpites"] = {"cfg": cfg, "at": now_iso(), "found": [s["name"] for s in found], "tried": tried}
              return found, tried

          def web_candidate(r):
              """Rádio de outro servidor para a aba "Fora da empresa" (só https, áudio direto, conferida pelo diretório)."""
              url = (r.get("url_resolved") or r.get("url") or "").strip()
              if not WEB_URL_OK.match(url) or PLAYLIST_EXT.search(url) or TOKEN_Q.search(urllib.parse.urlsplit(url).query): return None
              if r.get("lastcheckok") not in (1, True) or r.get("hls") in (1, True): return None
              codec = (r.get("codec") or "").upper()
              if codec not in ("MP3", "AAC", "AAC+"): return None
              tab = classify(r)
              name = clean_name(r.get("name"))
              if not tab or len(name) < 2: return None
              clicks = int(r.get("clickcount") or 0) + int(r.get("votes") or 0) // 10
              return {"key": web_key(url), "mount": None, "url": url, "tab": "fora", "name": name, "genre": genre_of(tab, r),
                      "place": place_of(r), "clicks": clicks, "codec": "MP3" if codec == "MP3" else "AAC",
                      "br": (r.get("countrycode") or "").upper() == "BR", "sport": tab == "sports",
                      "bitrate": int(r["bitrate"]) if str(r.get("bitrate") or "").isdigit() and 8 <= int(r["bitrate"]) <= 512 else None}

          def candidates():
              """Rádios do diretório, já com aba, gênero e lugar: da StreamTheWorld (abas normais) e de outros servidores
              (aba "Fora da empresa"). None se o diretório não respondeu."""
              pool, answered = {}, 0
              for params in QUERIES:
                  rows = radio_browser(params)
                  if rows is None: continue
                  answered += 1
                  for r in rows:
                      if not isinstance(r, dict): continue
                      mount = mount_of(r.get("url_resolved") or "") or mount_of(r.get("url") or "")
                      if not mount:
                          c = web_candidate(r)
                          if c and (c["key"] not in pool or c["clicks"] > pool[c["key"]]["clicks"]): pool[c["key"]] = c
                          continue
                      tab = classify(r)
                      name = clean_name(r.get("name"))
                      if not tab or len(name) < 2: continue
                      freq, genre_tab = None, tab
                      if tab == "web":
                          city = city_of(r.get("name") or "", mount, r.get("state"))
                          if city: tab, freq = city, freq_of(r.get("name") or "")
                      key = key_of(mount)
                      clicks = int(r.get("clickcount") or 0) + int(r.get("votes") or 0) // 10
                      codec = (r.get("codec") or "").upper()
                      ext = "aac" if ("AAC" in mount.upper() or mount.upper().endswith("_ADP") or "AAC" in codec) else "mp3"
                      c = {"key": key, "mount": mount, "ext": ext, "tab": tab, "name": name, "genre": genre_of(genre_tab, r), "place": place_of(r),
                           "clicks": clicks, "bitrate": int(r["bitrate"]) if str(r.get("bitrate") or "").isdigit() and 8 <= int(r["bitrate"]) <= 512 else None,
                           "br": (r.get("countrycode") or "").upper() == "BR", "sport": genre_tab == "sports"}
                      if freq: c["freq"] = freq
                      if key not in pool or clicks > pool[key]["clicks"]: pool[key] = c
              if not answered: return None
              web = sum(1 for c in pool.values() if c["tab"] == "fora")
              print(f"Radio Browser: {answered}/{len(QUERIES)} buscas responderam; {len(pool) - web} rádios da StreamTheWorld e {web} de outros servidores encontradas.")
              return list(pool.values())

          def slug(key):
              if key.startswith("U:"):   # rádio de outro servidor: código curto e estável a partir do endereço
                  return "extra-w-" + hashlib.sha1(key.encode()).hexdigest()[:12]
              return "extra-" + re.sub(r"[^a-z0-9]+", "-", key.lower()).strip("-")[:60]

          def web_key(url):
              """Chave de rádio de outro servidor: servidor + caminho (sem a consulta), em minúsculas."""
              try: u = urllib.parse.urlsplit(url)
              except ValueError: return "U:"
              return "U:" + (u.hostname or "").lower() + (u.path or "/").rstrip("/").lower()

          def url_ok(s):
              return bool(WEB_URL_OK.match(s.get("url", ""))) if s.get("tab") == "fora" else bool(URL_OK.match(s.get("url", "")))

          def run_parallel(items, fn, deadline):
              out = []
              with cf.ThreadPoolExecutor(max_workers=12) as ex:
                  futs = [ex.submit(fn, it) for it in items]
                  for f in futs:
                      left = deadline - time.time()
                      try: out.append(f.result(timeout=max(1, left)))
                      except Exception: out.append(None)
              return out

          def main():
              started = time.time()
              deadline = started + BUDGET_S
              keys, names = builtin_index()
              state, origin = load_state()
              state.setdefault("rejected", {})
              # Próxima busca: a data guardada, mas nunca depois de "última busca + intervalo atual" (vale na hora se o intervalo mudar).
              next_t = parse_iso(state.get("nextAt"))
              if parse_iso(state.get("searchedAt")): next_t = min(next_t, parse_iso(state.get("searchedAt")) + EVERY_H * 3600)
              # v34: abas novas na busca (São Paulo, Rio, BH e Fora da empresa) = busca já, sem esperar as 24 h.
              due = origin == "novo" or next_t <= started or not state.get("searchedAt") or state.get("tabs") != TABS or state.get("versao") != SEARCH_V
              if not due:
                  pub = publish(state, keys)
                  left_h = (next_t - started) / 3600
                  print(f"Rádios novas: {len(pub)} publicadas (origem: {origin}); próxima busca em {left_h:.1f} h.")
                  if origin != "cache": STATE.write_text(json.dumps(state, ensure_ascii=False), encoding="utf-8"); set_output(True)
                  return 0

              # 1) Confere de novo as rádios já descobertas (sai depois de MAX_FAILS buscas seguidas sem áudio).
              removed = []
              current = [s for s in state["stations"] if s.get("key") not in keys]
              checked = run_parallel(current, verify, deadline)
              kept = []
              for s, res in zip(current, checked):
                  if res is None: kept.append(s); continue        # sem tempo para conferir: fica como está
                  ok, why, upd = res
                  if ok:
                      upd["fails"] = 0; upd["okAt"] = now_iso(); kept.append(upd)
                  else:
                      s["fails"] = int(s.get("fails", 0)) + 1; s["lastError"] = why
                      if s["fails"] >= MAX_FAILS:
                          removed.append(s); state["rejected"][s["key"]] = now_iso()
                      else:
                          kept.append(s)
              # v34: rádio de São Paulo, Rio ou BH que estava em "Web e outras cidades" vai para a aba da cidade.
              for s in kept:
                  if s.get("tab") == "web":
                      city = city_of(s.get("name"), s.get("mount"), s.get("place"))
                      if city:
                          s["tab"] = city
                          f = freq_of(s.get("name"))
                          if f: s["freq"] = f
              # Limite por aba diminuiu: ficam as mais antigas (as que o ouvinte já conhece).
              per_tab = {t: sorted([s for s in kept if s["tab"] == t], key=lambda s: parse_iso(s.get("addedAt"))) for t in TABS}
              kept = [s for t in TABS for s in per_tab[t][:MAX_TAB]]

              # 2) Procura rádios novas para cada aba.
              added = {t: [] for t in TABS}
              pool = candidates() if PER_DAY > 0 else []
              now = time.time()
              state["rejected"] = {k: v for k, v in state["rejected"].items() if now - parse_iso(v) < RETRY_DAYS * 86400}
              taken = {s["key"] for s in kept} | {s["key"] for s in removed}
              seen_names = set(names) | {name_key(s["name"], s["place"]) for s in kept}
              for t in TABS:
                  room = min(PER_DAY, MAX_TAB - sum(1 for s in kept if s["tab"] == t))
                  if room <= 0 or not pool: continue
                  queue = sorted([c for c in pool if c["tab"] == t and c["key"] not in keys and c["key"] not in taken and c["key"] not in state["rejected"]
                                  and re.sub(r"[^a-z0-9]+", "", fold(c["name"])) not in names and name_key(c["name"], c["place"]) not in seen_names],
                                 key=lambda c: (0 if c.get("br") and (t != "fora" or c.get("sport")) else 1, -c["clicks"], c["name"]))   # v42: esporte do Brasil primeiro
                  tried = 0
                  while queue and len(added[t]) < room and tried < 40 and time.time() < deadline:
                      batch, queue = queue[: max(4, (room - len(added[t])) * 2)], queue[max(4, (room - len(added[t])) * 2):]
                      tried += len(batch)
                      for c, res in zip(batch, run_parallel(batch, verify, deadline)):
                          if res is None: continue
                          ok, why, upd = res
                          if not ok:
                              state["rejected"][c["key"]] = now_iso(); continue
                          nk = name_key(c["name"], c["place"])
                          if len(added[t]) >= room or nk in seen_names or c["key"] in taken: continue
                          upd.update(id=slug(c["key"]), addedAt=now_iso(), okAt=now_iso(), fails=0)
                          for k in ("clicks", "ext"): upd.pop(k, None)
                          added[t].append(upd); taken.add(c["key"]); seen_names.add(nk)
              # v42: palpites de rádios de esporte do Brasil na StreamTheWorld (1 vez por semana); só entram as que tocam.
              room_sports = MAX_TAB - sum(1 for s in kept if s["tab"] == "sports") - len(added["sports"])
              pal, pal_tried = try_palpites(state, keys, taken, deadline) if room_sports > 0 else ([], None)
              added["sports"].extend(pal[: max(0, room_sports)])
              for t in TABS: kept.extend(added[t])

              # 3) Grava o estado, publica e resume.
              ok_search = pool is not None
              state["stations"] = kept
              state["searchedAt"] = now_iso()
              state["tabs"] = TABS
              state["versao"] = SEARCH_V
              state["nextAt"] = now_iso(time.time() + (EVERY_H if ok_search else min(EVERY_H, 3)) * 3600)
              hist = state.setdefault("history", [])
              hist.append({"at": state["searchedAt"], "added": {t: [s["name"] for s in added[t]] for t in TABS if added[t]}, "removed": [s["name"] for s in removed]})
              state["history"] = hist[-30:]
              pub = publish(state, keys)
              STATE.write_text(json.dumps(state, ensure_ascii=False), encoding="utf-8")
              set_output(True)
              total_new = sum(len(v) for v in added.values())
              print(f"Rádios novas: +{total_new} hoje, {len(removed)} retiradas, {len(pub)} publicadas ({time.time() - started:.0f} s).")
              for t in TABS:
                  if added[t]: print(f"  {TAB_NAME[t]}: " + ", ".join(f"{s['name']} ({s['place']})" for s in added[t]))
              for s in removed: print(f"  RETIRADA: {s['name']} ({s.get('lastError', '')})")
              br_sports = sum(1 for s in pub if s["tab"] == "sports" and br_of(s)) + sum(1 for s in pub if s["tab"] == "fora" and br_of(s) and sport_of(s))
              pal_line = (f"Palpites de rádios de esporte do Brasil na StreamTheWorld: {pal_tried} nomes testados; "
                          f"{'confirmadas: ' + ', '.join(s['name'] for s in pal) if pal else 'nenhuma confirmada desta vez'} (próximo teste em {PALPITES_DAYS} dias).") if pal_tried is not None else ""
              print(f"  Esporte do Brasil descoberto no site: {br_sports} rádios.")
              if pal_line: print("  " + pal_line)
              if not ok_search: print("::warning title=Rádios novas::o diretório Radio Browser não respondeu; nova tentativa em 3 horas.")
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                      f.write(f"\n### Rádios novas (busca a cada {EVERY_H:g} h)\n\n")
                      f.write(f"**+{total_new}** hoje • {len(pub)} rádios descobertas no site • até {PER_DAY} novas por aba por dia, no máximo {MAX_TAB} por aba.\n\n")
                      f.write("| Aba | Novas hoje | Descobertas no site |\n|---|---|---|\n")
                      for t in TABS:
                          names_t = ", ".join(f"{s['name']} ({s['place']})" for s in added[t]) or "—"
                          f.write(f"| {TAB_NAME[t]} | {names_t} | {sum(1 for s in pub if s['tab'] == t)} |\n")
                      if removed:
                          f.write("\nRetiradas (sem áudio em " + str(MAX_FAILS) + " buscas seguidas): " + ", ".join(s["name"] for s in removed) + "\n")
                      if not ok_search:
                          f.write("\nO diretório Radio Browser não respondeu; nova tentativa em 3 horas.\n")
                      f.write(f"\nEsporte do Brasil (v42): {br_sports} rádios descobertas no site (abas Esportes e Fora da empresa); elas passam na frente na busca diária.\n")
                      if pal_line: f.write("\n" + pal_line + "\n")
                      f.write("\nNas abas normais só entram rádios da StreamTheWorld (as que tocam na rede da empresa); em \"Fora da empresa\", rádios de outros servidores (https). Todas responderam com áudio a partir do GitHub.\n")
              return 0

          def set_output(changed):
              if os.environ.get("GITHUB_OUTPUT"):
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f: f.write(f"salvar={'true' if changed else 'false'}\n")

          if __name__ == "__main__":
              sys.exit(main())
          SCRIPT
          python3 /tmp/descobrir.py

      - name: Guardar as rádios descobertas
        if: always() && steps.descobrir.outputs.salvar == 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/cyberwave-descobertas
          key: descobertas-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Gravar a voz da ANDRA-18
        continue-on-error: true
        timeout-minutes: 12
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          ANDRA_VOZ: ${{ vars.ANDRA_VOZ }}
          ANDRA_VOZ_EN: ${{ vars.ANDRA_VOZ_EN }}
          ANDRA_VOZ_ES: ${{ vars.ANDRA_VOZ_ES }}
        run: |
          if [ -z "$AZURE_SPEECH_KEY" ]; then pip install --quiet --disable-pip-version-check "edge-tts>=6.1,<8"; fi
          cat > /tmp/voz.py <<'SCRIPT'
          import asyncio, hashlib, html, json, os, re, shutil, subprocess, sys, time, urllib.request
          from pathlib import Path

          CACHE = Path(os.path.expanduser("~/.cache/cyberwave-voz")); CACHE.mkdir(parents=True, exist_ok=True)
          OUT = Path("voz"); OUT.mkdir(exist_ok=True)
          KEY = os.environ.get("AZURE_SPEECH_KEY", "").strip()
          REGION = os.environ.get("AZURE_SPEECH_REGION", "").strip()
          ENGINE = "azure" if KEY and REGION else "edge"
          VOICES = [v.strip() for v in (os.environ.get("ANDRA_VOZ") or "pt-BR-ThalitaMultilingualNeural,pt-BR-FranciscaNeural").split(",") if v.strip()]
          RATE = "+4%"
          MAX_NEWS = 40
          # Idioma de cada trecho (identificado pelo mesmo código do site, bloco andra-idioma do index.html): nomes de
          # músicas e rádios, manchetes em inglês etc. são gravados na voz daquele idioma e juntados num MP3 só.
          # Trocar a voz de um idioma: variáveis ANDRA_VOZ_EN e ANDRA_VOZ_ES (a primeira da lista que funcionar).
          LANG_VOICES = {
              "en": os.environ.get("ANDRA_VOZ_EN") or "en-US-AvaNeural,en-US-JennyNeural,en-US-AriaNeural",
              "es": os.environ.get("ANDRA_VOZ_ES") or "es-MX-DaliaNeural,es-US-PalomaNeural,es-ES-ElviraNeural",
              "fr": "fr-FR-DeniseNeural,fr-FR-EloiseNeural", "it": "it-IT-ElsaNeural,it-IT-IsabellaNeural",
              "de": "de-DE-KatjaNeural,de-DE-AmalaNeural", "ja": "ja-JP-NanamiNeural", "ko": "ko-KR-SunHiNeural",
              "zh": "zh-CN-XiaoxiaoNeural", "ru": "ru-RU-SvetlanaNeural", "ar": "ar-SA-ZariyahNeural", "he": "he-IL-HilaNeural",
              "el": "el-GR-AthinaNeural", "hi": "hi-IN-SwaraNeural", "th": "th-TH-PremwadeeNeural",
          }
          LOCALES = {"pt": "pt-BR", "en": "en-US", "es": "es-MX", "fr": "fr-FR", "it": "it-IT", "de": "de-DE", "ja": "ja-JP", "ko": "ko-KR",
                     "zh": "zh-CN", "ru": "ru-RU", "ar": "ar-SA", "he": "he-IL", "el": "el-GR", "hi": "hi-IN", "th": "th-TH"}
          LANG_NAME = {"pt": "português", "en": "inglês", "es": "espanhol", "fr": "francês", "it": "italiano", "de": "alemão", "ja": "japonês",
                       "ko": "coreano", "zh": "chinês", "ru": "russo", "ar": "árabe", "he": "hebraico", "el": "grego", "hi": "hindi", "th": "tailandês"}
          PLANS = {}       # texto -> [(idioma, trecho), ...] (só textos com trecho fora do português)
          LANG_VOICE = {}  # idioma -> voz que respondeu
          RUNNER = '''
          import { readFileSync, writeFileSync } from "node:fs";
          const { speechPlan } = await import(process.argv[2]);
          const texts = JSON.parse(readFileSync(process.argv[3], "utf8"));
          writeFileSync(process.argv[4], JSON.stringify(texts.map((t) => speechPlan(t).map((r) => [r.lang, r.text]))));
          '''

          def lead(it):
              if it.get("source") == "ancapsu": return "No canal Ancapsu"
              if it.get("lang") == "en": return "Na " + it["sourceName"] + ", em inglês"
              return "Segundo a " + it["sourceName"]

          LEX = []
          def say(text):
              # Pronúncia: troca termos ingleses pela grafia que a voz pt-BR lê certo (src/lib/andra-lexicon.ts).
              for rx, rep in LEX: text = rx.sub(rep, text)
              return text

          def file_for(voice, text):
              h = hashlib.sha1(f"{ENGINE}|{voice}|{RATE}|{say(text)}".encode()).hexdigest()[:20]
              return h + ".mp3"

          def load_plans(page, texts):
              """Divide cada texto em trechos por idioma com o código do site (src/lib/andra-lang.ts), via Node."""
              m = re.search(r'<script type="application/json" id="andra-idioma">(.*?)</script>', page, re.S)
              if not m:
                  print("::warning title=Voz::index.html sem o bloco andra-idioma (index.html antigo?): falas gravadas só em português")
                  return
              try:
                  Path("/tmp/andra-idioma.mjs").write_text(json.loads(m.group(1)), encoding="utf-8")
                  Path("/tmp/idioma-run.mjs").write_text(RUNNER, encoding="utf-8")
                  Path("/tmp/idioma-in.json").write_text(json.dumps(texts, ensure_ascii=False), encoding="utf-8")
                  subprocess.run(["node", "/tmp/idioma-run.mjs", "file:///tmp/andra-idioma.mjs", "/tmp/idioma-in.json", "/tmp/idioma-out.json"],
                                 check=True, timeout=120, capture_output=True, text=True)
                  out = json.loads(Path("/tmp/idioma-out.json").read_text(encoding="utf-8"))
                  for text, plan in zip(texts, out):
                      plan = [(l, t) for l, t in plan if l in LOCALES and t.strip()]
                      if len(plan) > 1 or (plan and plan[0][0] != "pt"): PLANS[text] = plan
              except subprocess.CalledProcessError as e:
                  why = " ".join((e.stderr or str(e)).split())[:200]
                  print(f"::warning title=Voz::identificador de idioma falhou ({why}): falas gravadas só em português")
                  PLANS.clear()
              except Exception as e:
                  print(f"::warning title=Voz::identificador de idioma falhou ({' '.join(str(e).split())[:200]}): falas gravadas só em português")
                  PLANS.clear()

          def parts_of(plan, voice):
              """Partes da gravação: [(voz, texto, sotaque para <lang> ou None)], juntando trechos seguidos da mesma voz."""
              multi = ENGINE == "azure" and "Multilingual" in voice
              parts = []
              for lang, text in plan:
                  if lang == "pt": parts.append((voice, say(text), None))
                  # Azure com voz Multilingual: a mesma voz troca de idioma (<lang>), sem mudar o timbre.
                  elif multi: parts.append((voice, text.strip(), LOCALES[lang]))
                  elif LANG_VOICE.get(lang): parts.append((LANG_VOICE[lang], text.strip(), None))
                  # Sem voz do idioma: voz em português com o vocabulário de pronúncia (como antes).
                  else: parts.append((voice, say(text), None))
              merged = []
              for p in parts:
                  if merged and merged[-1][0] == p[0] and merged[-1][2] == p[2]:
                      merged[-1] = (p[0], merged[-1][1].rstrip() + " " + p[1].lstrip(), p[2])
                  else:
                      merged.append(p)
              return [p for p in merged if p[1].strip()]

          def file_for_parts(voice, parts):
              h = hashlib.sha1(f"{ENGINE}|{voice}|{RATE}|{json.dumps(parts, ensure_ascii=False)}".encode()).hexdigest()[:20]
              return h + ".mp3"

          def azure(text, voice, path):
              body = html.escape(say(text))
              # Manchete em inglês: vozes "Multilingual" leem o trecho original com pronúncia americana.
              if "Multilingual" in voice and ", em inglês: " in text:
                  head, tail = text.split(", em inglês: ", 1)
                  body = html.escape(say(head) + ", em inglês: ") + "<lang xml:lang='en-US'>" + html.escape(tail) + "</lang>"
              azure_post(f"<voice name='{voice}'><prosody rate='{RATE}'>{body}</prosody></voice>", path)

          def azure_post(voices_xml, path):
              ssml = ("<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='https://www.w3.org/2001/mstts' xml:lang='pt-BR'>"
                      + voices_xml + "</speak>")
              req = urllib.request.Request(
                  f"https://{REGION}.tts.speech.microsoft.com/cognitiveservices/v1", data=ssml.encode("utf-8"), method="POST",
                  headers={"Ocp-Apim-Subscription-Key": KEY, "Content-Type": "application/ssml+xml",
                           "X-Microsoft-OutputFormat": "audio-24khz-48kbitrate-mono-mp3", "User-Agent": "CyberwaveRadio"})
              with urllib.request.urlopen(req, timeout=40) as r:
                  data = r.read()
              if len(data) < 500: raise RuntimeError("áudio vazio")
              path.write_bytes(data)

          async def edge(text, voice, path):
              import edge_tts
              tmp = path.with_suffix(".tmp")
              await asyncio.wait_for(edge_tts.Communicate(say(text), voice, rate=RATE).save(str(tmp)), 60)
              if tmp.stat().st_size < 500: raise RuntimeError("áudio vazio")
              tmp.replace(path)

          async def synth(text, voice, path):
              if ENGINE == "azure": await asyncio.to_thread(azure, text, voice, path)
              else: await edge(text, voice, path)

          async def synth_parts(parts, path):
              """Fala com trechos em mais de um idioma: Azure num pedido só (várias vozes); edge-tts parte por parte, juntando os MP3."""
              if ENGINE == "azure":
                  xml = ""
                  for v, text, tag in parts:
                      body = html.escape(text)
                      if tag: body = f"<lang xml:lang='{tag}'>{body}</lang>"
                      xml += f"<voice name='{v}'><prosody rate='{RATE}'>{body}</prosody></voice>"
                  await asyncio.to_thread(azure_post, xml, path)
                  return
              import edge_tts
              data = b""
              for i, (v, text, _tag) in enumerate(parts):
                  tmp = path.with_suffix(f".{i}.tmp")
                  await asyncio.wait_for(edge_tts.Communicate(text, v, rate=RATE).save(str(tmp)), 60)
                  if tmp.stat().st_size < 300: raise RuntimeError(f"áudio vazio ({v})")
                  data += tmp.read_bytes()
                  tmp.unlink()
              path.write_bytes(data)

          async def main():
              page = Path("index.html").read_text(encoding="utf-8")
              m = re.search(r'<script type="application/json" id="andra-frases">(.*?)</script>', page, re.S)
              phrases = json.loads(m.group(1)) if m else {}
              # Rádios descobertas (radios-extras.json, passo anterior): a apresentadora anuncia cada uma com a mesma voz.
              try:
                  for s in json.loads(Path("radios-extras.json").read_text(encoding="utf-8")).get("stations", [])[:1500]:
                      if re.fullmatch(r"extra-[a-z0-9-]{2,60}", str(s.get("id", ""))) and isinstance(s.get("fala"), str) and 0 < len(s["fala"]) <= 200:
                          phrases["radio-" + s["id"]] = s["fala"]
              except Exception:
                  pass
              lx = re.search(r'<script type="application/json" id="andra-lexico">(.*?)</script>', page, re.S)
              if lx:
                  for p, rep in json.loads(lx.group(1)):
                      try: LEX.append((re.compile(p, re.I), rep))
                      except re.error as e: print(f"termo de pronúncia ignorado ({p}): {e}")
              print(f"Vocabulário de pronúncia: {len(LEX)} termos")
              if not m: print("::warning title=Voz::index.html sem o bloco andra-frases (index.html antigo?)")
              news_path = Path("noticias.json")
              news = json.loads(news_path.read_text(encoding="utf-8")) if news_path.exists() else {"items": []}
              items = news.get("items", [])
              for it in items:
                  it.pop("audio", None)
                  it["speech"] = lead(it) + ": " + it["title"]

              load_plans(page, list(dict.fromkeys([*phrases.values(), *(it["speech"] for it in items[:MAX_NEWS])])))

              # Escolhe a voz: a primeira da lista que funcionar.
              voice = None
              for v in VOICES:
                  probe = CACHE / file_for(v, "Cyberwave Radio.")
                  try:
                      if not probe.exists(): await synth("Cyberwave Radio.", v, probe)
                      voice = v; break
                  except Exception as e:
                      print(f"Voz {v} indisponível: {str(e)[:120]}")
              if not voice:
                  print("::warning title=Voz::Nenhuma voz neural respondeu; o site vai usar a voz do navegador.")
                  return 1

              # Vozes dos outros idiomas que aparecem nos textos (com Azure e voz Multilingual, a própria voz troca de idioma).
              multi = ENGINE == "azure" and "Multilingual" in voice
              needed = sorted({l for plan in PLANS.values() for l, _ in plan if l != "pt"})
              for lang in ([] if multi else needed):
                  for v in [x.strip() for x in LANG_VOICES.get(lang, "").split(",") if x.strip()]:
                      probe = CACHE / file_for(v, "Cyberwave Radio.")
                      try:
                          if not probe.exists(): await synth("Cyberwave Radio.", v, probe)
                          LANG_VOICE[lang] = v; break
                      except Exception as e:
                          print(f"Voz {v} ({LANG_NAME.get(lang, lang)}) indisponível: {str(e)[:120]}")
                  else:
                      print(f"Sem voz em {LANG_NAME.get(lang, lang)}: esses trechos ficam na voz em português.")

              texts = {}   # texto -> (arquivo, partes ou None)
              def job(text):
                  parts = parts_of(PLANS[text], voice) if text in PLANS else None
                  if parts and all(v == voice and not tag for v, _, tag in parts): parts = None
                  texts[text] = (file_for_parts(voice, parts) if parts else file_for(voice, text), parts)
              for pid, text in phrases.items(): job(text)
              for it in items[:MAX_NEWS]: job(it["speech"])

              sem = asyncio.Semaphore(4)
              made = failed = 0
              async def one(text, name, parts):
                  nonlocal made, failed
                  path = CACHE / name
                  if path.exists():
                      os.utime(path); return
                  async with sem:
                      for attempt in range(2):
                          try:
                              if parts: await synth_parts(parts, path)
                              else: await synth(text, voice, path)
                              made += 1; return
                          except Exception as e:
                              err = str(e)[:120]
                              await asyncio.sleep(1.5)
                      failed += 1
                      print(f"falhou: {text[:60]}… ({err})")
              await asyncio.gather(*(one(t, n, p) for t, (n, p) in texts.items()))

              ready = lambda name: (CACHE / name).exists()
              out_phrases = {}
              for pid, text in phrases.items():
                  name = texts[text][0]
                  if ready(name):
                      shutil.copyfile(CACHE / name, OUT / name); out_phrases[pid] = "voz/" + name
              for it in items[:MAX_NEWS]:
                  name = texts[it["speech"]][0]
                  if ready(name):
                      shutil.copyfile(CACHE / name, OUT / name); it["audio"] = "voz/" + name
              news_path.write_text(json.dumps(news, ensure_ascii=False, indent=1), encoding="utf-8")
              used = sorted({l for t, (n, p) in texts.items() if p for l, _ in PLANS.get(t, []) if l != "pt" and (multi or LANG_VOICE.get(l))})
              voices = {"pt": voice, **{l: (voice if multi else LANG_VOICE[l]) for l in used}}
              mixed = sum(1 for n, p in texts.values() if p)
              (OUT / "manifest.json").write_text(json.dumps({"updatedAt": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "engine": ENGINE, "voice": voice, "voices": voices, "mixed": mixed, "phrases": out_phrases}, ensure_ascii=False), encoding="utf-8")

              # Limpa áudios sem uso há mais de 3 dias.
              for f in CACHE.glob("*.mp3"):
                  if time.time() - f.stat().st_mtime > 3 * 86400: f.unlink(missing_ok=True)

              print(f"Voz {voice} ({ENGINE}): {made} gravados agora, {failed} falharam, {len(out_phrases)} falas fixas e {sum(1 for i in items if i.get('audio'))} manchetes com áudio.")
              langs_txt = ", ".join(f"{LANG_NAME.get(l, l)} {v}" for l, v in voices.items() if l != "pt") or "nenhum trecho em outro idioma"
              print(f"Idiomas: {mixed} falas com trecho em outro idioma; vozes: {langs_txt}.")
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
                      s.write(f"\n### Voz da ANDRA-18\n\nVoz **{voice}** ({'Azure AI Speech' if ENGINE == 'azure' else 'edge-tts'}): {len(out_phrases)} falas fixas, {sum(1 for i in items if i.get('audio'))} manchetes com áudio, {made} gravados nesta execução, {failed} falhas.\n")
                      s.write(f"\nIdiomas: {mixed} falas com trecho em outro idioma (cada trecho na voz do seu idioma); vozes: {langs_txt}.\n")
              return 0

          sys.exit(asyncio.run(main()))
          SCRIPT
          python3 /tmp/voz.py

      - name: Guardar áudios gravados
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/cyberwave-voz
          key: voz-${{ github.run_id }}-${{ github.run_attempt }}

      # Testa todas as rádios a partir do GitHub (a cada 6 horas e a cada envio de arquivos) e publica
      # radios-status.json. O site usa o resultado para começar pelo endereço que está funcionando
      # e para avisar quais rádios estão instáveis. Resumo com cada rádio fora do ar na aba Actions.
      # Obs.: os servidores do GitHub ficam nos EUA; rádios que só liberam acesso no Brasil podem aparecer
      # como fora do ar aqui e tocar normalmente para os ouvintes.
      - name: Restaurar o último teste das rádios
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/cyberwave-radios
          key: radios-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: radios-

      - name: Testar as rádios
        continue-on-error: true
        timeout-minutes: 8
        env:
          RADIOS_A_CADA_HORAS: ${{ vars.RADIOS_A_CADA_HORAS }}
        run: |
          cat > /tmp/radios.py <<'SCRIPT'
          import concurrent.futures as cf, json, os, re, socket, sys, time, unicodedata, urllib.parse, urllib.request
          socket.setdefaulttimeout(15)
          from datetime import datetime, timezone
          from pathlib import Path

          CACHE = Path(os.path.expanduser("~/.cache/cyberwave-radios")); CACHE.mkdir(parents=True, exist_ok=True)
          PREV = CACHE / "status.json"
          EVERY_H = float(os.environ.get("RADIOS_A_CADA_HORAS") or 6)
          FORCE = os.environ.get("GITHUB_EVENT_NAME") in ("push", "workflow_dispatch")
          UA = "Mozilla/5.0 (CyberwaveRadio; verificacao de streams; +https://github.com)"
          AUDIO_CT = re.compile(r"audio/|application/ogg|video/mp2t|application/octet-stream|aacp", re.I)
          PLAYLIST_CT = re.compile(r"mpegurl|x-scpls|pls", re.I)

          def now_iso(): return datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          def fold(t): return "".join(c for c in unicodedata.normalize("NFD", (t or "").lower()) if unicodedata.category(c) != "Mn")

          def looks_audio(b):
              return b[:3] == b"ID3" or b[:4] == b"OggS" or any(b[i] == 0xFF and (b[i + 1] & 0xF0) == 0xF0 for i in range(min(len(b) - 1, 4096)))

          def probe(url, depth=0):
              """True/False, motivo, endereço final."""
              if not url.startswith("https://"): return False, "não é https (o site bloqueia http)", url
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": UA, "Icy-MetaData": "0", "Accept": "*/*"})
                  with urllib.request.urlopen(req, timeout=12) as r:
                      ct = r.headers.get("Content-Type", "")
                      final = r.geturl()
                      if not str(final).startswith("https://"): return False, "redireciona para http (o site bloqueia)", final
                      if PLAYLIST_CT.search(ct) and depth == 0:
                          text = r.read(65536).decode("utf-8", "replace")
                          links = re.findall(r"https?://[^\s\"'<>]+", text)
                          if not links: return False, "lista sem endereço", final
                          return probe(links[0], 1)
                      data = b""
                      t0 = time.time()
                      while len(data) < 12288 and time.time() - t0 < 10:
                          chunk = r.read(4096)
                          if not chunk: break
                          data += chunk
                      if "text/html" in ct.lower(): return False, "respondeu uma página, não áudio", final
                      if len(data) < 4096: return False, f"pouco áudio ({len(data)} bytes)", final
                      if not (AUDIO_CT.search(ct) or looks_audio(data)): return False, f"tipo inesperado ({ct[:40]})", final
                      return True, "", final
              except urllib.error.HTTPError as e:
                  return False, f"HTTP {e.code}", url
              except Exception as e:
                  return False, type(e).__name__ + (f": {e.reason}" if hasattr(e, "reason") else ""), url

          def lookup(lk):
              if not lk: return []
              q = {"name": lk.get("query", ""), "hidebroken": "true", "order": "clickcount", "reverse": "true", "limit": "15"}
              if lk.get("country"): q["countrycode"] = lk["country"]
              for host in ("de1", "de2", "fi1", "nl1"):
                  try:
                      req = urllib.request.Request(f"https://{host}.api.radio-browser.info/json/stations/search?" + urllib.parse.urlencode(q), headers={"User-Agent": UA})
                      rows = json.load(urllib.request.urlopen(req, timeout=10))
                      break
                  except Exception:
                      rows = None
              if not rows: return []
              out = []
              for r in rows:
                  name = fold(r.get("name", ""))
                  if any(w not in name for w in lk.get("match", [])): continue
                  if lk.get("matchAny") and not any(fold(w) in name for w in lk["matchAny"]): continue
                  if any(fold(w) in name for w in lk.get("exclude", [])): continue
                  u = (r.get("url_resolved") or r.get("url") or "").strip()
                  if u.startswith("https://") and u not in out: out.append(u)
              return out[:4]

          # ---- v34: endereço do áudio achado na página da própria rádio (rádios pedidas que não estão no diretório) ----
          BROWSER_UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/158.0 Safari/537.36"
          URL_IN = re.compile(r"https?:(?:\\?/){2}[A-Za-z0-9.-]+(?::\d{2,5})?(?:\\?/[^\s\"'<>`()\[\]{}|\\^]*)?")
          STREAMISH = re.compile(r"\.(mp3|aac|aacp|ogg|opus)(\?|$)|/(stream|live|listen|autodj|radio)(/|\?|$|\.)|/;|icecast|shoutcast|radio\.co/|zeno\.fm/|live365\.com/|"
                                 r"streamguys|securenetsystems|radiojar|radioking|mixlr|azuracast|caster\.fm|streamon\.fm|//(ice|stream|live|radio|audio|listen)[0-9-]*\.|:\d{4,5}/", re.I)
          NOT_STREAM = re.compile(r"\.(png|jpe?g|gif|svg|webp|ico|css|js|mjs|json|woff2?|ttf|html?|php|xml|txt|pdf)(\?|$)|google|gstatic|facebook|fbcdn|twitter|//x\.com|instagram|"
                                  r"youtube|youtu\.be|apple\.com|spotify|tiktok|linktr\.ee|cloudflare|jsdelivr|unpkg|fonts\.|wp-json|schema\.org|w3\.org|gravatar|paypal|cash\.app|"
                                  r"streema|tunein|radio\.net|onlineradiobox|mytuner|radio-browser", re.I)
          PLAYER_HOSTS = re.compile(r"live365|radio\.co|zeno|streamguys|securenet|radiojar|radioking|mixlr|azuracast|caster|shoutcast|icecast|stream", re.I)

          def page_text(url, limit=2_000_000):
              req = urllib.request.Request(url, headers={"User-Agent": BROWSER_UA, "Accept": "text/html,application/javascript,*/*"})
              with urllib.request.urlopen(req, timeout=12) as r:
                  ct = (r.headers.get("Content-Type") or "").lower()
                  if ct and not re.search(r"html|javascript|json|text/plain|ecmascript", ct): return "", r.geturl()
                  return r.read(limit).decode("utf-8", "replace"), r.geturl()

          def known_platform(u):
              """Página de player conhecida -> endereço do áudio (ex.: Live365)."""
              m = re.match(r"https?://(?:player\.|www\.)?live365\.com/(?:station/|embeds/v\d/player/)?(a\d{4,6})\b", u)
              return f"https://streaming.live365.com/{m.group(1)}" if m else None

          def site_streams(sites):
              """Endereços de áudio citados na página da rádio (e nos scripts/players que ela carrega). Só https."""
              found = []
              for site in (sites or [])[:2]:
                  try: html, final = page_text(site)
                  except Exception: continue
                  texts, home = [html], urllib.parse.urlsplit(final).hostname or ""
                  for src in re.findall(r"<(?:script|iframe)[^>]+src=[\"']([^\"']+)[\"']", html, re.I)[:20]:
                      full = urllib.parse.urljoin(final, src)
                      host = urllib.parse.urlsplit(full).hostname or ""
                      if host != home and not PLAYER_HOSTS.search(host): continue
                      try: texts.append(page_text(full)[0])
                      except Exception: pass
                      if len(texts) >= 8: break
                  for t in texts:
                      for raw in URL_IN.findall(t):
                          u = raw.replace("\\/", "/").rstrip(".,;")
                          known = known_platform(u)
                          if known: u = known
                          elif NOT_STREAM.search(u.split("?")[0]) or not STREAMISH.search(u): continue
                          if u.startswith("http://"): u = "https://" + u[7:]
                          if u not in found: found.append(u)
              return found[:15]

          def triton_reason(urls):
              """Rádio da StreamTheWorld que não respondeu: o código da Triton diz por quê (404 = não existe; 453 = bloqueada)."""
              for u in urls:
                  m = re.search(r"streamtheworld\.com/api/livestream-redirect/([A-Za-z0-9_]+?)(?:\.(?:aac|mp3))?$", u)
                  if not m: continue
                  mount = re.sub(r"_SC$", "", m.group(1))
                  try:
                      req = urllib.request.Request(f"https://playerservices.streamtheworld.com/api/livestream?version=1.10&mount={mount}&lang=en", headers={"User-Agent": UA})
                      xml = urllib.request.urlopen(req, timeout=10).read(65536).decode("utf-8", "replace")
                      c = re.search(r"<status-code>\s*(\d{3})\s*</status-code>", xml)
                      if c: return "StreamTheWorld " + c.group(1) + {"404": " (não existe mais)", "453": " (bloqueada para o país do servidor do GitHub)"}.get(c.group(1), "")
                  except Exception:
                      pass
                  return ""
              return ""

          def check(st):
              tried = []
              for u in st["urls"] + st.get("triton", []):
                  ok, why, final = probe(u); tried.append(why)
                  if ok: return {"ok": True, "url": None if u == (st["urls"] or [None])[0] else u, "err": None}
              for u in lookup(st.get("lookup")):
                  if u in st["urls"]: continue
                  ok, why, final = probe(u)
                  if ok: return {"ok": True, "url": u, "err": None, "via": "radio-browser"}
              for u in site_streams(st.get("sites")):
                  if u in st["urls"]: continue
                  ok, why, final = probe(u)
                  if ok: return {"ok": True, "url": u, "err": None, "via": "site"}
              err = tried[0] if tried else "sem endereço"
              why = triton_reason(st["urls"] + st.get("triton", []))
              return {"ok": False, "url": None, "err": f"{err}; {why}" if why else err}

          def main():
              html = Path("index.html").read_text(encoding="utf-8")
              m = re.search(r'<script type="application/json" id="radios-lista">(.*?)</script>', html, re.S)
              if not m:
                  print("::warning title=Rádios::index.html sem o bloco radios-lista (index.html antigo?)"); return 0
              stations = json.loads(m.group(1))
              # Rádios descobertas automaticamente (radios-extras.json) também entram no teste.
              try:
                  known = {s["id"] for s in stations}
                  for s in json.loads(Path("radios-extras.json").read_text(encoding="utf-8")).get("stations", []):
                      if s.get("id") not in known and str(s.get("url", "")).startswith("https://"):
                          stations.append({"id": s["id"], "name": s.get("name") or s["id"], "urls": [s["url"]]})
              except Exception:
                  pass
              prev = {}
              try: prev = json.loads(PREV.read_text(encoding="utf-8"))
              except Exception: pass
              age_h = (time.time() - PREV.stat().st_mtime) / 3600 if PREV.exists() else 1e9
              if prev and not FORCE and age_h < EVERY_H:
                  Path("radios-status.json").write_text(json.dumps(prev, ensure_ascii=False), encoding="utf-8")
                  print(f"Rádios: última verificação há {age_h:.1f} h (refaz a cada {EVERY_H:g} h); publicando o resultado guardado."); return 0
              pst = prev.get("stations", {})
              res = {}
              with cf.ThreadPoolExecutor(max_workers=16) as ex:
                  for st, r in zip(stations, ex.map(check, stations)):
                      r["fails"] = 0 if r["ok"] else int(pst.get(st["id"], {}).get("fails", 0)) + 1
                      r["at"] = now_iso()
                      res[st["id"]] = r
              ok = sum(1 for r in res.values() if r["ok"])
              out = {"checkedAt": now_iso(), "total": len(res), "ok": ok, "stations": res}
              data = json.dumps(out, ensure_ascii=False)
              Path("radios-status.json").write_text(data, encoding="utf-8"); PREV.write_text(data, encoding="utf-8")
              names = {s["id"]: s["name"] for s in stations}
              bad = [(names[i], r) for i, r in res.items() if not r["ok"]]
              alt = [(names[i], r) for i, r in res.items() if r["ok"] and r.get("url")]
              print(f"Rádios: {ok}/{len(res)} no ar; {len(alt)} pelo endereço de reserva; {len(bad)} sem resposta.")
              for n, r in bad: print(f"  FORA: {n}: {r['err']} (falhou {r['fails']}x seguidas)")
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
                      s.write(f"\n### Rádios\n\n**{ok} de {len(res)}** responderam com áudio a partir dos servidores do GitHub (EUA).\n")
                      if alt:
                          s.write("\nTocando pelo endereço de reserva (o site já usa este endereço):\n\n")
                          for n, r in alt: s.write(f"- {n}: `{r['url']}`\n")
                      if bad:
                          s.write("\n| Rádio | Motivo | Falhas seguidas |\n|---|---|---|\n")
                          for n, r in bad: s.write(f"| {n} | {r['err']} | {r['fails']} |\n")
                          s.write("\nObs.: algumas rádios bloqueiam acesso de fora do país; se uma delas tocar no Brasil, ignore.\n")
              return 0

          if __name__ == "__main__":
              sys.exit(main())
          SCRIPT
          python3 /tmp/radios.py

      - name: Guardar o teste das rádios

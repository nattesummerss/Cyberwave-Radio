          SITE_URL: ${{ steps.pages.outputs.base_url }}
          MUSICAS_MINUTOS: ${{ vars.MUSICAS_MINUTOS }}
          MUSICAS_POR_ARTISTA: ${{ vars.MUSICAS_POR_ARTISTA }}
        run: |
          if [ ! -f ferramentas/indice-musicas.mjs ]; then
            echo "::warning title=Músicas::ferramentas/indice-musicas.mjs não está no repositório (envie a pasta ferramentas do pacote do site)"
            exit 0
          fi
          node ferramentas/indice-musicas.mjs

      - name: Guardar o índice de músicas
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/cyberwave-musicas
          key: musicas-${{ github.run_id }}-${{ github.run_attempt }}

      # Podcasts (v30): a cada 6 horas o GitHub procura no catálogo do Apple Podcasts os episódios mais novos dos
      # podcasts da lista do site (bloco podcasts-lista do index.html) e publica podcasts.json. Também descobre o
      # endereço final do áudio dos 3 episódios mais novos (sem os serviços de estatística, que algumas redes bloqueiam).
      # Variáveis opcionais: PODCASTS_A_CADA_HORAS (padrão 6), PODCASTS_EPISODIOS (padrão 20 por podcast).
      - name: Restaurar a lista de podcasts
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/cyberwave-podcasts
          key: podcasts-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: podcasts-

      - name: Atualizar os podcasts (a cada 6 h)
        id: podcasts
        continue-on-error: true
        timeout-minutes: 9
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          PODCASTS_A_CADA_HORAS: ${{ vars.PODCASTS_A_CADA_HORAS }}
          PODCASTS_EPISODIOS: ${{ vars.PODCASTS_EPISODIOS }}
        run: |
          cat > /tmp/podcasts.py <<'SCRIPT'
          import gzip, json, os, re, sys, time, unicodedata, urllib.error, urllib.parse, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path

          def num(name, default, lo, hi):
              try: v = float(os.environ.get(name, "").strip() or default)
              except ValueError: v = default
              return max(lo, min(hi, v))

          EVERY_H = num("PODCASTS_A_CADA_HORAS", 6, 1, 168)
          EPISODES = int(num("PODCASTS_EPISODIOS", 20, 5, 60))
          RESOLVE_DAYS = 7
          GAP_S = num("PODCASTS_PAUSA", 2.5, 0, 10)
          BUDGET_S = num("PODCASTS_MINUTOS", 5, 0.1, 15) * 60
          CACHE = Path(os.path.expanduser(os.environ.get("PODCASTS_CACHE") or "~/.cache/cyberwave-podcasts")); CACHE.mkdir(parents=True, exist_ok=True)
          STATE = CACHE / "estado.json"
          OUT = Path("podcasts.json")
          UA = "Mozilla/5.0 (CyberwaveRadio-Actions; +https://github.com)"
          NOW = time.time()
          iso = lambda t: time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(t))

          def out(k, v):
              if os.environ.get("GITHUB_OUTPUT"):
                  with open(os.environ["GITHUB_OUTPUT"], "a") as f: f.write(f"{k}={v}\n")

          def summary(text):
              print(text)
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f: f.write(text + "\n")

          def fold(s):
              s = unicodedata.normalize("NFD", s or "")
              s = "".join(c for c in s if unicodedata.category(c) != "Mn").lower()
              return re.sub(r"[^a-z0-9]+", " ", s).strip()

          def matches(d, name, artist):
              n = f" {fold(name)} "
              return all(f" {fold(m)} " in n for m in d["match"]) and (not d.get("artist") or fold(d["artist"]) in fold(artist))

          def get_json(url, timeout=20):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept-Encoding": "gzip"})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  data = r.read()
                  if r.headers.get("Content-Encoding") == "gzip": data = gzip.decompress(data)
              return json.loads(data.decode("utf-8"))

          def read_defs():
              html = Path("index.html").read_text(encoding="utf-8")
              m = re.search(r'<script type="application/json" id="podcasts-lista">(.*?)</script>', html, re.S)
              if not m: return None
              return [d for d in json.loads(m.group(1)) if isinstance(d, dict) and d.get("id") and d.get("term") and d.get("match")]

          def load_state():
              try: return json.loads(STATE.read_text(encoding="utf-8"))
              except Exception: return {}

          class RateLimited(Exception): pass

          def itunes(url):
              try: return get_json(url)
              except urllib.error.HTTPError as e:
                  if e.code in (403, 429): raise RateLimited(str(e.code))
                  raise

          def resolve(d):
              country = d.get("country") or "BR"
              q = urllib.parse.urlencode({"media": "podcast", "entity": "podcast", "limit": 15, "country": country, "term": d["term"]})
              for r in itunes(f"https://itunes.apple.com/search?{q}").get("results", []):
                  if isinstance(r.get("collectionId"), int) and matches(d, r.get("collectionName", ""), r.get("artistName", "")):
                      return {"collectionId": r["collectionId"], "name": r.get("collectionName", ""), "artist": r.get("artistName", ""),
                              "art": r.get("artworkUrl600") or r.get("artworkUrl100") or "", "link": r.get("collectionViewUrl", ""), "resolvedAt": NOW}
              return None

          def clean(s, n):
              return re.sub(r"[\x00-\x1f<>]", " ", str(s or "")).strip()[:n]

          def episodes(info, country):
              q = urllib.parse.urlencode({"id": info["collectionId"], "media": "podcast", "entity": "podcastEpisode", "limit": EPISODES, "country": country})
              eps = []
              for r in itunes(f"https://itunes.apple.com/lookup?{q}").get("results", []):
                  if r.get("wrapperType") != "podcastEpisode": continue
                  url = str(r.get("episodeUrl") or "")
                  if not re.match(r"^https?://", url): continue
                  eps.append({"id": str(r.get("trackId") or url)[:80], "title": clean(r.get("trackName"), 200), "date": clean(r.get("releaseDate"), 40),
                              "dur": round((r.get("trackTimeMillis") or 0) / 1000), "url": re.sub(r"^http://", "https://", url),
                              "desc": clean(r.get("shortDescription") or r.get("description"), 400)})
              eps.sort(key=lambda e: e["date"], reverse=True)
              return eps

          SIGNED = re.compile(r"(expires|signature|x-amz-|token|policy|key-pair|hdnts|exp=)", re.I)
          def final_url(url):
              """Segue os redirecionamentos de estatística (podtrac, chartable, pdst...) até o servidor do áudio."""
              for method in ("HEAD", "GET"):
                  try:
                      req = urllib.request.Request(url, method=method, headers={"User-Agent": UA, "Range": "bytes=0-1"})
                      with urllib.request.urlopen(req, timeout=12) as r:
                          end = r.geturl()
                      if end and end != url and end.startswith("https://") and not SIGNED.search(urllib.parse.urlparse(end).query):
                          return end
                      return None
                  except Exception:
                      continue
              return None

          def main():
              defs = read_defs()
              if defs is None:
                  print("::warning title=Podcasts::index.html sem o bloco podcasts-lista (index.html antigo?)"); return 0
              st = load_state()
              prev = st.get("data") or {}
              if not prev:
                  site = os.environ.get("SITE_URL", "").rstrip("/")
                  if site:
                      try:
                          prev = get_json(f"{site}/podcasts.json"); print("lista anterior recuperada do site")
                      except Exception as e:
                          print(f"sem lista anterior no site ({e})")
              due = NOW >= float(st.get("nextAt") or 0)
              if not due and prev.get("shows"):
                  OUT.write_text(json.dumps(prev, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
                  print(f"podcasts: próxima atualização em {iso(float(st['nextAt']))}; republicada a lista de {prev.get('updatedAt')}")
                  out("salvar", "false"); return 0

              resolved = st.get("resolved") or {}
              prev_shows = {s.get("id"): s for s in prev.get("shows", []) if isinstance(s, dict)}
              shows, rows, pending, limited = [], [], False, False
              start = time.time()
              for d in defs:
                  old = prev_shows.get(d["id"])
                  if limited or time.time() - start > BUDGET_S:
                      pending = True
                      if old: shows.append(old)
                      rows.append(f"| {d['name']} | mantido da lista anterior |" if old else f"| {d['name']} | fica para a próxima execução |"); continue
                  try:
                      info = resolved.get(d["id"])
                      if not info or NOW - float(info.get("resolvedAt", 0)) > RESOLVE_DAYS * 86400:
                          info = resolve(d); time.sleep(GAP_S)
                          if not info:
                              resolved.pop(d["id"], None)
                              if old: shows.append(old)
                              rows.append(f"| {d['name']} | não encontrado no Apple Podcasts{' (mantido o anterior)' if old else ''} |"); continue
                          resolved[d["id"]] = info
                      eps = episodes(info, d.get("country") or "BR"); time.sleep(GAP_S)
                      if not eps:
                          if old: shows.append(old)
                          rows.append(f"| {d['name']} | sem episódios no catálogo |"); continue
                      known = {e["id"]: e.get("direct") for e in (old or {}).get("episodes", []) if isinstance(e, dict)}
                      for e in eps:
                          if known.get(e["id"]): e["direct"] = known[e["id"]]
                      shows.append({"id": d["id"], "name": info["name"] or d["name"], "artist": info["artist"], "art": info["art"], "link": info["link"], "episodes": eps})
                      rows.append(f"| {d['name']} | {len(eps)} episódios — último em {eps[0]['date'][:10]} |")
                  except RateLimited:
                      limited, pending = True, True
                      if old: shows.append(old)
                      rows.append(f"| {d['name']} | o Apple Podcasts pediu uma pausa; tenta de novo em 1 hora |")
                  except Exception as e:
                      if old: shows.append(old)
                      rows.append(f"| {d['name']} | falhou ({str(e)[:80]}){' — mantido o anterior' if old else ''} |")

              # Endereço final do áudio dos 3 episódios mais novos (ajuda em redes que bloqueiam os serviços de estatística).
              todo = [e for s in shows for e in s["episodes"][:3] if "direct" not in e]
              with ThreadPoolExecutor(8) as pool:
                  for e, end in zip(todo, pool.map(lambda e: final_url(e["url"]), todo)):
                      if end: e["direct"] = end
              data = {"updatedAt": iso(NOW), "shows": shows}
              OUT.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
              next_at = NOW + (3600 if limited else 900 if pending else EVERY_H * 3600)
              STATE.write_text(json.dumps({"data": data, "resolved": resolved, "nextAt": next_at}, ensure_ascii=False), encoding="utf-8")
              out("salvar", "true")
              total = sum(len(s["episodes"]) for s in shows)
              summary(f"\n### Podcasts\n\n{len(shows)} de {len(defs)} podcasts, {total} episódios. Próxima atualização: {iso(next_at)}.\n\n| Podcast | Situação |\n|---|---|\n" + "\n".join(rows) + "\n")
              if not shows: print("::warning title=Podcasts::nenhum podcast foi encontrado nesta execução")
              return 0

          if __name__ == "__main__":
              sys.exit(main())
          SCRIPT
          python3 /tmp/podcasts.py

      - name: Guardar a lista de podcasts
        if: always() && steps.podcasts.outputs.salvar == 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/cyberwave-podcasts
          key: podcasts-${{ github.run_id }}-${{ github.run_attempt }}

      # Extras OPCIONAIS para músicas fora do índice (o site funciona sem eles):
      #   MUSICA_PROXY_URL (variável) – endereço do buscador próprio na Vercel, ex.: https://<projeto>.vercel.app/api/musica
      #   CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID (segredos) – publica o mesmo buscador na Cloudflare
      #   YOUTUBE_API_KEY (variável ou segredo) – chave da YouTube Data API v3, restrita ao site (fica visível no site)
      - name: Publicar o buscador de músicas (Cloudflare Worker, opcional)
        id: worker
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Sem CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID: pulando (use a Vercel ou a variável MUSICA_PROXY_URL)."
            exit 0
          fi
          if [ ! -f worker/musica-worker.js ]; then echo "::warning title=Músicas::worker/musica-worker.js não está no repositório"; exit 0; fi
          ORIGIN="https://${GITHUB_REPOSITORY_OWNER,,}.github.io"
          set +e
          npx --yes wrangler@3 deploy worker/musica-worker.js --name cyberwave-musica --compatibility-date 2024-11-01 --var "ORIGENS:${ORIGIN}" > wrangler.log 2>&1
          CODE=$?
          set -e
          sed -E 's/[A-Za-z0-9_-]{30,}/***/g' wrangler.log
          URL=$(grep -oE 'https://cyberwave-musica\.[a-z0-9-]+\.workers\.dev' wrangler.log | head -1)
          if [ -n "$URL" ]; then echo "url=$URL" >> "$GITHUB_OUTPUT"; echo "Buscador publicado em $URL"; fi
          if [ $CODE -ne 0 ] || [ -z "$URL" ]; then
            echo "falhou=1" >> "$GITHUB_OUTPUT"
            if grep -qi "workers.dev subdomain" wrangler.log; then
              echo "::warning title=Músicas::Crie seu subdomínio workers.dev: entre uma vez em Workers & Pages no painel da Cloudflare e rode de novo."
            else
              echo "::warning title=Músicas::A publicação na Cloudflare falhou; veja o log deste passo."
            fi
          fi
          rm -f wrangler.log

      - name: Configurar e testar as fontes de músicas
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY || vars.YOUTUBE_API_KEY }}
          MUSICA_PROXY_URL: ${{ vars.MUSICA_PROXY_URL || steps.worker.outputs.url }}
          CLOUDFLARE_FALHOU: ${{ steps.worker.outputs.falhou }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          from pathlib import Path
          p = Path("musica.json")
          cfg = {}
          if p.exists():
              try: cfg = json.loads(p.read_text(encoding="utf-8"))
              except Exception: print("::warning title=Músicas::musica.json inválido; será refeito")
          for k in ("jamendoClientId", "appleMusicDeveloperToken", "appleMusicStorefront"): cfg.pop(k, None)
          env = lambda k: os.environ.get(k, "").strip()
          if env("YOUTUBE_API_KEY"): cfg["youtubeApiKey"] = env("YOUTUBE_API_KEY")
          url = env("MUSICA_PROXY_URL").rstrip("/")
          if url:
              u = urllib.parse.urlparse(url)
              if u.hostname and u.hostname.endswith(".vercel.app") and u.path in ("", "/"):
                  url = f"{u.scheme}://{u.netloc}/api/musica"
              cfg["musicaProxyUrl"] = url
          p.write_text(json.dumps(cfg, ensure_ascii=False, indent=1), encoding="utf-8")

          def teste(params):
              base = cfg["musicaProxyUrl"]
              full = base + ("&" if "?" in base else "?") + urllib.parse.urlencode(params)
              t0 = time.time()
              req = urllib.request.Request(full, headers={"User-Agent": "CyberwaveRadio-Actions/1.0"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode("utf-8")), round((time.time() - t0) * 1000)

          linhas = []
          if cfg.get("musicaProxyUrl"):
              try:
                  saude, ms = teste({"op": "saude"})
                  linhas.append(f"| Buscador próprio | responde ({saude.get('versao', '?')}, {ms} ms) — {cfg['musicaProxyUrl']} |")
                  try:
                      hits, ms = teste({"op": "buscar", "q": "Linkin Park Numb"})
                      linhas.append(f"| Busca no YouTube pelo buscador | {len(hits)} vídeos ({ms} ms) |")
                  except Exception as e:
                      linhas.append(f"| Busca no YouTube pelo buscador | FALHOU: {str(e)[:120]} |")
                  try:
                      lf, ms = teste({"op": "lastfm", "artist": "Linkin Park", "title": "Numb"})
                      linhas.append(f"| Last.fm pelo buscador | {len(lf.get('ids', []))} vídeo(s) ({ms} ms) |")
                  except Exception as e:
                      linhas.append(f"| Last.fm pelo buscador | FALHOU: {str(e)[:120]} |")
              except Exception as e:
                  linhas.append(f"| Buscador próprio | NÃO RESPONDE ({str(e)[:120]}) — confira o endereço em MUSICA_PROXY_URL |")
          else:
              extra = " (a publicação na Cloudflare falhou — veja o passo anterior)" if env("CLOUDFLARE_FALHOU") else ""
              linhas.append(f"| Buscador próprio (opcional) | não configurado{extra} — o site usa o índice de músicas completas (tabela acima) |")
          linhas.append(f"| YouTube Data API | {'configurada' if cfg.get('youtubeApiKey') else 'sem chave (opcional)'} |")
          print("\n".join(linhas))
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
                  s.write("\n### Fontes de músicas\n\n| Fonte | Situação |\n|---|---|\n| Catálogo iTunes/Deezer | sem cadastro |\n| Internet Archive | sem cadastro |\n" + "\n".join(linhas) + "\n\nNo site, abra **Músicas sob demanda → Diagnóstico das fontes** para ver o que funciona no seu aparelho.\n")
          PY

      # Publicação à prova de "Re-run": cada tentativa envia o site com um nome próprio (github-pages-1,
      # github-pages-2, ...) e publica exatamente esse pacote. Antes, repetir uma execução que falhou deixava
      # dois pacotes "github-pages" na mesma execução e a publicação parava com
      # "Multiple artifacts named github-pages were unexpectedly found for this workflow run".
      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .

      # Logo depois do envio, o GitHub às vezes ainda não enxerga o pacote e a publicação falha com
      # "No artifacts named ... were found" (acontece quando envio e publicação ficam na mesma etapa).
      - name: Aguardar o pacote ficar disponível
        run: sleep 20

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

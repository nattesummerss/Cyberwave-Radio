# Cyberwave Radio: publica o site no GitHub Pages e atualiza as notícias da apresentadora.
#
# O navegador não pode ler os sites de notícia diretamente (eles bloqueiam outros sites),
# então o próprio GitHub busca as manchetes a cada 15 minutos e grava o arquivo
# noticias.json junto com o site.
#
# Para funcionar: Settings → Pages → Build and deployment → Source: "GitHub Actions".

name: Cyberwave Radio - site e notícias

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Buscar manchetes (CNN Brasil, BBC News Brasil, Fox News, Revista Oeste, Ancapsu)
        run: |
          cat > /tmp/noticias.mjs <<'SCRIPT'
          import { writeFileSync } from "node:fs";

          // Fontes. Cada uma tenta os endereços em ordem e usa o primeiro que responder.
          const SOURCES = [
            { id: "cnn", name: "CNN Brasil", lang: "pt", urls: ["https://www.cnnbrasil.com.br/internacional/feed/", "https://www.cnnbrasil.com.br/feed/"] },
            { id: "bbc", name: "BBC News Brasil", lang: "pt", urls: ["https://feeds.bbci.co.uk/portuguese/rss.xml"] },
            { id: "fox", name: "Fox News", lang: "en", urls: ["https://moxie.foxnews.com/google-publisher/world.xml", "https://moxie.foxnews.com/google-publisher/latest.xml"] },
            { id: "oeste", name: "Revista Oeste", lang: "pt", urls: ["https://revistaoeste.com/mundo/feed/", "https://revistaoeste.com/feed/"] },
            { id: "ancapsu", name: "Ancapsu", lang: "pt", urls: ["https://www.youtube.com/feeds/videos.xml?channel_id=UCLTWPE7XrHEe8m_xAmNbQ-Q"] },
          ];
          const PER_SOURCE = 8;
          const MAX_AGE_MS = 3 * 24 * 60 * 60 * 1000;
          const OUT = process.argv[2] || "noticias.json";
          const UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36 CyberwaveRadio/1.0";
          const BREAKING = /(^|[^\p{L}\p{N}])(urgente|plant[aã]o|[uú]ltima hora|ao vivo|alerta|breaking|live updates?|just in|developing)(?=$|[^\p{L}\p{N}])/iu;

          const ENT = { amp: "&", lt: "<", gt: ">", quot: '"', apos: "'", nbsp: " " };
          const entities = (s) =>
            s.replace(/&(#x[0-9a-f]+|#\d+|[a-z]+);/gi, (all, c) => {
              if (c[0] === "#") {
                const n = c[1] === "x" || c[1] === "X" ? parseInt(c.slice(2), 16) : parseInt(c.slice(1), 10);
                return n > 0 && n < 0x110000 ? String.fromCodePoint(n) : "";
              }
              return ENT[c.toLowerCase()] ?? all;
            });
          const text = (s) =>
            entities(entities(String(s ?? "").replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, "$1")).replace(/<[^>]*>/g, " "))
              .replace(/<[^>]*>/g, " ")
              .replace(/\s+/g, " ")
              .trim();
          const tag = (block, name) => {
            const m = new RegExp(`<${name}(?:\\s[^>]*)?>([\\s\\S]*?)</${name}>`, "i").exec(block);
            return m ? m[1] : "";
          };
          const okLink = (u) => {
            try {
              const url = new URL(u);
              return url.protocol === "https:" || url.protocol === "http:" ? url.href : "";
            } catch {
              return "";
            }
          };

          function parse(xml) {
            const atom = /<feed[\s>]/i.test(xml) && /<entry[\s>]/i.test(xml);
            const re = atom ? /<entry[\s>][\s\S]*?<\/entry>/gi : /<item[\s>][\s\S]*?<\/item>/gi;
            const out = [];
            for (const [block] of xml.matchAll(re)) {
              const title = text(tag(block, "title")).slice(0, 280);
              let link = "";
              if (atom) {
                link = (/<link[^>]*rel=["']alternate["'][^>]*href=["']([^"']+)["']/i.exec(block) || /<link[^>]*href=["']([^"']+)["']/i.exec(block) || [])[1] || "";
                link = entities(link);
              } else {
                link = text(tag(block, "link")) || text(tag(block, "guid"));
              }
              const when = Date.parse(text(tag(block, "pubDate") || tag(block, "published") || tag(block, "updated") || tag(block, "dc:date")));
              link = okLink(link);
              if (!title || !link) continue;
              out.push({ title, link, publishedAt: Number.isFinite(when) ? when : null });
            }
            return out;
          }

          async function load(src) {
            let lastError = "sem resposta";
            for (const url of src.urls) {
              try {
                const res = await fetch(url, {
                  headers: { "user-agent": UA, accept: "application/rss+xml, application/atom+xml, application/xml, text/xml;q=0.9, */*;q=0.8" },
                  redirect: "follow",
                  signal: AbortSignal.timeout(20000),
                });
                if (!res.ok) {
                  lastError = `HTTP ${res.status}`;
                  continue;
                }
                const items = parse(await res.text());
                if (items.length === 0) {
                  lastError = "feed vazio";
                  continue;
                }
                return { items, url };
              } catch (err) {
                lastError = err && err.name === "TimeoutError" ? "tempo esgotado" : String(err && err.message || err).slice(0, 120);
              }
            }
            throw new Error(lastError);
          }

          const now = Date.now();
          const sources = [];
          const items = [];
          await Promise.all(
            SOURCES.map(async (src) => {
              try {
                const { items: got, url } = await load(src);
                const fresh = got
                  .filter((i) => i.publishedAt === null || now - i.publishedAt < MAX_AGE_MS)
                  .sort((a, b) => (b.publishedAt ?? 0) - (a.publishedAt ?? 0))
                  .slice(0, PER_SOURCE);
                for (const i of fresh) {
                  items.push({ source: src.id, sourceName: src.name, lang: src.lang, title: i.title, link: i.link, publishedAt: i.publishedAt, breaking: BREAKING.test(i.title) });
                }
                sources.push({ id: src.id, name: src.name, ok: true, count: fresh.length, feed: url });
                console.log(`OK   ${src.name}: ${fresh.length} manchetes (${url})`);
              } catch (err) {
                sources.push({ id: src.id, name: src.name, ok: false, count: 0, error: String(err.message || err) });
                console.log(`FALHA ${src.name}: ${err.message || err}`);
              }
            }),
          );
          sources.sort((a, b) => SOURCES.findIndex((s) => s.id === a.id) - SOURCES.findIndex((s) => s.id === b.id));
          items.sort((a, b) => (b.publishedAt ?? 0) - (a.publishedAt ?? 0));
          writeFileSync(OUT, JSON.stringify({ updatedAt: new Date(now).toISOString(), sources, items }, null, 1));
          console.log(`${items.length} manchetes gravadas em ${OUT}`);
          SCRIPT
          node /tmp/noticias.mjs noticias.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4

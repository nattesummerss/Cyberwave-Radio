      # endereço final do áudio dos 3 episódios mais novos (sem os serviços de estatística, que algumas redes bloqueiam).
      # v41: descobre podcasts e audiolivros hospedados no Spotify for Creators (o servidor que toca na AVD) em 146 buscas
      # e 12 abas, aos poucos (30 buscas a cada execução), acumulando os novos toda semana até o limite de cada aba.
      # Variáveis opcionais: PODCASTS_A_CADA_HORAS (padrão 6), PODCASTS_EPISODIOS (padrão 20 por podcast),
      # PODCASTS_AUTO_POR_ABA (padrão 20), AUDIOLIVROS_AUTO_POR_ABA (padrão 40), PODCASTS_AUTO_EPISODIOS (padrão 12),
      # PODCASTS_BUSCAS_POR_VEZ (padrão 30), PODCASTS_SERVIDORES_AVD (padrão d3ctxlq1ktw2nl.cloudfront.net).
      - name: Restaurar a lista de podcasts
